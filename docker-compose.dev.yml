# Local dev stack: Postgres + the Flask app with hot reload.
#
#   cp .env.example .env         # fill in GEMINI_API_KEY + OPENAI_API_KEY
#   docker compose -f docker-compose.dev.yml up --build
#
# App:  http://localhost:5000   (log in as dev / dev; APP_PORT in .env to change)
# DB:   localhost:5432           (tasker / tasker; DB_PORT to change)
#
# The schema in db/init/ only runs when the DB volume is empty. To start over:
#   docker compose -f docker-compose.dev.yml down -v

name: tasker-dev

services:
  db:
    # same version as prod
    image: postgres:16.9-bullseye
    environment:
      TZ: America/Chicago
      POSTGRES_USER: tasker
      POSTGRES_PASSWORD: tasker
      POSTGRES_DB: tasker
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - tasker_dev_db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasker -d tasker"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    # Flask dev server with auto-reload instead of gunicorn
    command: flask --app logic.main run --debug --host 0.0.0.0 --port 5000
    env_file:
      - path: .env
        required: false
    environment:
      TZ: America/Chicago
      PYTHONUNBUFFERED: 1
      POSTGRES_USER: tasker
      POSTGRES_PASSWORD: tasker
      POSTGRES_DB: tasker
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev-only-not-secret}
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    volumes:
      # edit code on the host, the server reloads
      - ./logic:/localtodo/logic
    depends_on:
      db:
        # the app opens its connection pool at import time
        condition: service_healthy

volumes:
  tasker_dev_db:
