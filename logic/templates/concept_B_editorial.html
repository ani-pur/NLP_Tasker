<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>TASKER // CONCEPT B — EDITORIAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,800;9..144,900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f4;
      --fg: #1c1917;
      --accent: #c2410c;
      --accent-soft: #fed7aa;
      --muted: #a8a29e;
      --card: #ffffff;
      --border: #e7e5e4;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
      --shadow-hover: 0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Subtle paper texture ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.3;
      pointer-events: none;
      z-index: 9999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    }

    /* ── Header ── */
    header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(250,248,244,0.8);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--fg);
    }

    .logo em {
      font-style: italic;
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--fg); }
    .nav-links a.exit { color: var(--accent); }

    .user-chip {
      font-size: 12px;
      font-weight: 600;
      color: var(--fg);
      background: var(--accent-soft);
      padding: 5px 14px;
      border-radius: 100px;
    }

    /* ── Layout ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 40px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 48px;
      align-items: start;
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
        padding: 24px 20px;
        gap: 32px;
      }
    }

    /* ── Task section ── */
    .task-section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 32px;
    }

    .task-section-title {
      font-family: 'Fraunces', serif;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    .task-count {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .clock-area {
      text-align: right;
    }

    .clock-date {
      font-family: 'Fraunces', serif;
      font-size: 14px;
      font-weight: 600;
      font-style: italic;
      color: var(--accent);
    }

    .clock-time {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Task cards ── */
    .task-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .task-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .task-card .accent-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 10px;
      vertical-align: middle;
    }

    .task-name {
      font-family: 'Fraunces', serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--fg);
      display: inline;
      vertical-align: middle;
    }

    .task-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-top: 8px;
      margin-left: 18px;
    }

    .task-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      margin-left: 18px;
    }

    .task-date-pill {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 100px;
    }

    .task-date-pill.overdue {
      color: var(--accent);
      background: #fef2f2;
      border-color: #fecaca;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s;
      opacity: 0;
    }

    .task-card:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: var(--accent); background: #fef2f2; }

    /* ── Divider ── */
    .past-due-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
    }

    .past-due-divider::before, .past-due-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      opacity: 0.3;
    }

    .past-due-tag {
      font-family: 'Fraunces', serif;
      font-size: 11px;
      font-weight: 600;
      font-style: italic;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ── Input panel ── */
    .input-panel {
      position: sticky;
      top: 100px;
    }

    .input-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .input-heading {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .input-subtext {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 18px;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--fg);
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.08);
    }

    textarea::placeholder { color: #c7c2bc; }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
    }

    .char-counter {
      font-size: 11px;
      color: var(--muted);
    }

    .submit-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 100px;
      padding: 10px 28px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(194,65,12,0.2);
    }

    .submit-btn:hover {
      background: #9a3412;
      box-shadow: 0 4px 16px rgba(194,65,12,0.3);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* ── Motivational quote ── */
    .daily-quote {
      margin-top: 24px;
      padding: 18px 20px;
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      border-radius: 14px;
      border: 1px solid #fde68a;
    }

    .daily-quote p {
      font-family: 'Fraunces', serif;
      font-size: 14px;
      font-style: italic;
      color: #92400e;
      line-height: 1.5;
    }

    .daily-quote cite {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      font-style: normal;
      color: var(--muted);
    }

    /* ── Reminder badge ── */
    .reminder-badge {
      font-family: 'Fraunces', serif;
      font-size: 11px;
      font-weight: 600;
      font-style: italic;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      padding: 3px 10px;
      border-radius: 100px;
    }

    .reminder-preview {
      display: none;
      font-family: 'Fraunces', serif;
      font-size: 11px;
      font-weight: 600;
      font-style: italic;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 4px;
    }

    /* ── Theme selector ── */
    .theme-select {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 14px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .theme-select:hover { color: var(--fg); }
  </style>
</head>
<body>

  <header>
    <div class="logo">Tasker<em>.</em></div>
    <div class="nav-links">
      <span class="user-chip">{{ username }}</span>
      <select onchange="if(this.value)window.location=this.value" class="theme-select">
        <option value="" selected>Theme: Editorial</option>
        <option value="/switch/3">Default</option>
        <option value="/switch/2">Classic</option>
        <option value="/switch/4">Brutalist</option>
        <option value="/switch/6">Glass</option>
        <option value="/switch/7">Terminal</option>
        <option value="/switch/8">Midnight</option>
      </select>
      <a href="https://github.com/ani-pur/NLP_Tasker/blob/main/README.md" target="_blank" rel="noopener">Docs</a>
      <a href="{{ url_for('logout') }}" class="exit">Log out</a>
    </div>
  </header>

  <main>
    <div class="task-section">
      <div class="task-section-header">
        <div>
          <div class="task-section-title">Your Tasks</div>
          <div class="task-count" id="taskCount">0 active</div>
        </div>
        <div class="clock-area">
          <div class="clock-date" id="clockDate"></div>
          <div class="clock-time" id="clockTime"></div>
        </div>
      </div>

      <div id="taskList"></div>
    </div>

    <div class="input-panel">
      <div class="input-card">
        <div class="input-heading">What's on your mind?</div>
        <div class="input-subtext">Type naturally. Tasker handles dates, times, colors, and details.</div>
        <form id="taskForm">
          <textarea id="task_description" maxlength="200" placeholder="submit project by Friday evening, orange"></textarea>
          <span class="reminder-preview" id="reminderPreview">🔔 <span id="reminderValue"></span></span>
          <div class="input-footer">
            <span class="char-counter">0/200</span>
            <button type="submit" class="submit-btn">Add Task</button>
          </div>
        </form>
      </div>

      <div class="daily-quote">
        <p>"The secret of getting ahead is getting started."</p>
        <cite>— Mark Twain</cite>
      </div>
    </div>
  </main>

  <script>
    // --- UI State & Inputs ---
    const taskInput = document.getElementById('task_description');
    const prompts = ["gym next monday 7am legs, blue", "groceries in 2 hours yellow, milk eggs chicken rice", "submit project by Friday evening, orange", "call mom tomorrow at noon pink", "doctor appointment next tuesday 9am, red", "read 20 pages of book tonight, purple", "fix production bug before standup, green"];
    taskInput.placeholder = prompts[Math.floor(Math.random() * prompts.length)];

    const colorMap = { blue: '#87CEEB', red: '#f05656', green: '#6CE5A9', pink: '#F8C8DC', orange: '#ff7f00', purple: '#A96CE5', yellow: '#FDDA0D' };

    function extractColor(text) {
      const matches = text.toLowerCase().match(/\b(blue|red|green|pink|orange|purple|yellow)\b/g);
      if (matches && matches.length > 0) return colorMap[matches[matches.length - 1]];
      return '#FFFFFF';
    }

    function parseReminder(text) {
      const t = text.toLowerCase();
      const rel = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?(\d+)\s*(m|min|mins|minute|minutes|h|hr|hrs|hour|hours)\b/);
      if (rel) {
        const val = parseInt(rel[1]);
        const unit = rel[2];
        if (unit.startsWith('h')) {
          const clamped = Math.min(val, 24);
          return { offsetHours: clamped, absoluteTime: null, display: `${clamped}h` };
        } else {
          const hours = val / 60;
          const clamped = Math.min(hours, 24);
          return { offsetHours: clamped, absoluteTime: null, display: `${val}m` };
        }
      }
      const abs = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?at\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
      if (abs) {
        const hour = parseInt(abs[1]);
        const mins = abs[2] ? parseInt(abs[2]) : 0;
        const period = abs[3].toUpperCase();
        const display = mins > 0 ? `${hour}:${String(mins).padStart(2,'0')}${period}` : `${hour}${period}`;
        const absoluteTime = `${hour}:${String(mins).padStart(2,'0')} ${period}`;
        return { offsetHours: null, absoluteTime, display };
      }
      return { offsetHours: 0, absoluteTime: null, display: null };
    }

    taskInput.addEventListener('input', (e) => {
      const text = e.target.value.toLowerCase();
      const regex = /\b(blue|red|green|pink|orange|purple|yellow)\b/g;
      const matches = text.match(regex);
      if (matches && matches.length > 0) {
        e.target.style.color = colorMap[matches[matches.length - 1]];
      } else {
        e.target.style.color = '';
      }
      const reminder = parseReminder(e.target.value);
      const preview = document.getElementById('reminderPreview');
      if (reminder.display) {
        document.getElementById('reminderValue').textContent = reminder.display;
        preview.style.display = 'inline-block';
      } else {
        preview.style.display = 'none';
      }
    });

    // --- Clock Logic ---
    let clockTimer;

    function renderClock() {
      const now = new Date();
      document.getElementById("clockDate").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
      document.getElementById("clockTime").textContent = now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }

    function scheduleNextClockTick() {
      if (clockTimer) clearTimeout(clockTimer);
      const msToNextMinute = (60000 - (Date.now() % 60000)) + 80;
      clockTimer = setTimeout(() => {
        renderClock();
        scheduleNextClockTick();
      }, msToNextMinute);
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { renderClock(); scheduleNextClockTick(); }
    });

    // --- Core Tasker Logic ---
    let addTaskCooldown = false;
    const ADD_TASK_COOLDOWN_MS = 3000;

    function buildUserTzMetadata() {
      const now = new Date();
      return {
        "todaysDate (yyyy/mm/dd): ": now.toLocaleDateString('en-CA'),
        "current time: ": ` ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })} `,
        "current day: ": ` ${now.toLocaleDateString('en-US', { weekday: 'long' })} `,
        "utc_offset_minutes": now.getTimezoneOffset()
      };
    }

    async function loadTasks() {
      try {
        const response = await fetch('/tasks');
        const tasks = await response.json();
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = '';

        const now = new Date();
        const pastDueTasks = [];
        const upcomingTasks = [];

        tasks.forEach(task => {
          const [id, __, task_name, task_time, task_description, due_date, color, reminder_display] = task;
          let isPastDue = false;
          if (due_date) {
            const cleanDate = due_date.replace(/ 00:00:00.*$/, '').trim();
            const timeStr = task_time ? task_time.trim() : '11:59 PM';
            const taskDateTime = new Date(`${cleanDate} ${timeStr}`);
            if (!isNaN(taskDateTime) && taskDateTime < now) isPastDue = true;
          }
          if (isPastDue) pastDueTasks.push(task);
          else upcomingTasks.push(task);
        });

        document.getElementById('taskCount').textContent = `${tasks.length} active`;

        const renderTaskHtml = (task, isPastDue) => {
          const [id, __, task_name, task_time, task_description, due_date, color, reminder_display] = task;
          const dueDateDisplay = due_date ? due_date.replace(/ 00:00:00.*$/, '') : "No due date";
          const pillClass = isPastDue ? 'task-date-pill overdue' : 'task-date-pill';

          return `
            <div class="task-card">
              <div>
                <span class="accent-dot" style="background:${color || '#FFFFFF'};"></span>
                <span class="task-name">${task_name}</span>
              </div>
              <div class="task-desc">${task_description}</div>
              <div class="task-footer">
                <div style="display:flex;align-items:center;gap:8px;">
                  ${reminder_display ? `<span class="reminder-badge">🔔 ${reminder_display}</span>` : ''}
                  <span class="${pillClass}">${dueDateDisplay}${task_time ? ' · ' + task_time : ''}</span>
                </div>
                <button class="delete-btn" onclick="deleteTask(${id})">Remove</button>
              </div>
            </div>
          `;
        };

        pastDueTasks.forEach(task => {
          taskList.insertAdjacentHTML('beforeend', renderTaskHtml(task, true));
        });

        if (pastDueTasks.length > 0) {
          taskList.insertAdjacentHTML('beforeend', `
            <div class="past-due-divider">
              <span class="past-due-tag">Past Due</span>
            </div>
          `);
        }

        upcomingTasks.forEach(task => {
          taskList.insertAdjacentHTML('beforeend', renderTaskHtml(task, false));
        });

      } catch (err) { console.error("Error loading tasks:", err); }
    }

    async function deleteTask(taskId) {
      const response = await fetch('/tasks/' + taskId, { method: 'DELETE' });
      if (response.ok) loadTasks();
      else alert('Failed to delete task');
    }

    document.getElementById('taskForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (addTaskCooldown) return;
      addTaskCooldown = true;
      setTimeout(() => { addTaskCooldown = false; }, ADD_TASK_COOLDOWN_MS);

      const inputEl = document.getElementById('task_description');
      const description = inputEl.value;
      if (description.length < 10 || description.length > 200) { alert('Task description must be 10-200 characters'); return; }

      const reminder = parseReminder(description);
      const response = await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task_description: description, user_tz_metadata: buildUserTzMetadata(), color: extractColor(description), notif_time_offset: reminder.offsetHours, notif_absolute_time: reminder.absoluteTime, reminder_display: reminder.display })
      });
      if (response.ok) {
        document.getElementById('taskForm').reset();
        inputEl.style.color = '';
        document.getElementById('reminderPreview').style.display = 'none';
        inputEl.placeholder = prompts[Math.floor(Math.random() * prompts.length)];
        loadTasks();
      }
      else { alert('Failed to add task'); }
    });

    // --- Push Notifications ---
    async function setupPushNotifications() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;
        const existing = await reg.pushManager.getSubscription();
        if (existing) return;
        const keyRes = await fetch('/push/vapid-public-key');
        const keyData = await keyRes.json();
        if (!keyData.public_key) return;
        const rawKey = atob(keyData.public_key.replace(/-/g, '+').replace(/_/g, '/'));
        const vapidKey = new Uint8Array(rawKey.length);
        for (let i = 0; i < rawKey.length; i++) vapidKey[i] = rawKey.charCodeAt(i);
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidKey });
        const subJson = sub.toJSON();
        await fetch('/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endpoint: subJson.endpoint, keys: subJson.keys })
        });
      } catch (err) { console.error('Push setup failed:', err); }
    }

    // --- Init ---
    renderClock();
    scheduleNextClockTick();
    loadTasks();
    setupPushNotifications();
  </script>
</body>
</html>
