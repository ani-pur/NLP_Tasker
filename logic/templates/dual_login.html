<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/pwa/manifest.webmanifest">
    <meta name="theme-color" content="#111520">
    <title>Login | Tasker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { base: '#111520', accent: '#fcd34d' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #111520; }

        /* Ambient Parallax Background */
        .dot-grid {
            background-image: radial-gradient(rgba(252, 211, 77, 0.25) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            filter: drop-shadow(0 0 4px rgba(252, 211, 77, 0.4));
            will-change: transform, background-position;
            animation: grid-drift 20s linear infinite;
        }

        @keyframes grid-drift {
            0% { background-position: 0 0; }
            100% { background-position: 48px 48px; }
        }
    </style>
</head>

<body class="text-slate-300 antialiased selection:bg-accent selection:text-base flex items-center justify-center min-h-screen relative overflow-hidden">

    <div class="fixed inset-[-50px] pointer-events-none z-0 dot-grid [mask-image:radial-gradient(ellipse_at_center,black_30%,transparent_80%)]" id="parallax-grid"></div>

    <div class="relative z-10 w-full max-w-sm mx-auto p-8 bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight mb-1">Tasker 2.5!</h1>
            <p class="text-sm text-slate-400">Let Tasker remember it.</p>
        </div>

        {% if error %}
        <div class="text-red-400 text-sm mb-6 p-3 bg-red-400/10 border border-red-400/20 rounded-lg text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
            <div>
                <input 
                    type="text" 
                    name="username" 
                    placeholder="Username" 
                    autocomplete="username"
                    class="w-full bg-slate-950/50 border border-slate-800 focus:border-accent/50 focus:ring-1 focus:ring-accent/50 text-white px-4 py-3 rounded-lg outline-none transition placeholder:text-slate-600"
                >
            </div>

            <div>
                <input 
                    type="password" 
                    name="password" 
                    placeholder="Password" 
                    autocomplete="current-password"
                    required
                    class="w-full bg-slate-950/50 border border-slate-800 focus:border-accent/50 focus:ring-1 focus:ring-accent/50 text-white px-4 py-3 rounded-lg outline-none transition placeholder:text-slate-600"
                >
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full bg-accent text-base font-semibold py-3 px-4 rounded-lg hover:bg-yellow-300 transition duration-200 shadow-[0_0_15px_rgba(252,211,77,0.15)] hover:shadow-[0_0_20px_rgba(252,211,77,0.3)]">
                    Login
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <a href="{{ url_for('signup') }}" class="text-sm font-medium text-slate-400 hover:text-white transition-colors duration-200">Sign up</a>
        </div>
    </div>

    <script>
        // Mouse tracking for parallax background
        const grid = document.getElementById('parallax-grid');
        if (window.matchMedia("(pointer: fine)").matches) {
            document.addEventListener('mousemove', (e) => {
                const xGrid = (e.clientX / window.innerWidth - 0.5) * 30;
                const yGrid = (e.clientY / window.innerHeight - 0.5) * 30;
                grid.style.transform = `translate(${xGrid * -1}px, ${yGrid * -1}px)`;
            });
        }
    </script>
</body>
</html>
