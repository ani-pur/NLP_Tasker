<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Access - Tasker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #030303ef;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .login-container {
      background-color: #00000000;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.329);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 70%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #cccccc;
      border-radius: 4px;
      background-color: #2d2d2d;
      color: white;
    }

    input::placeholder {
      color: #b0b0b0;
    }

    button {
      padding: 10px 20px;
      background-color: #007BFF;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .logout-link {
      display: inline-block;
      margin-top: 18px;
      color: #4f8cff;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: underline;
      cursor: pointer;
    }

    .logout-link:hover {
      color: #6ed0fa;
    }
  </style>
</head>

<body>
  <div class="login-container">

    <form method="POST" action="{{ url_for('signup') }}">
      <input
        type="text"
        name="username"
        placeholder="Enter Username"
        required
      >

      <input
        type="password"
        name="password"
        placeholder="Enter Password"
        required
      >

      <input
        type="email"
        name="email"
        placeholder="Email (optional)"
      >

      <br>
      <button type="submit">Request Access</button>
    </form>

    <a href="{{ url_for('login') }}" class="logout-link">Back to Login</a>

  </div>
</body>
</html>
