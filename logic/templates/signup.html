<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/pwa/manifest.webmanifest">
    <title>Request Access | Tasker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { base: '#111520', accent: '#fcd34d' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #111520; }
        .dot-grid {
            background-image: radial-gradient(rgba(252, 211, 77, 0.25) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            filter: drop-shadow(0 0 4px rgba(252, 211, 77, 0.4));
            will-change: transform, background-position;
            animation: grid-drift 20s linear infinite;
        }
        @keyframes grid-drift {
            0% { background-position: 0 0; }
            100% { background-position: 48px 48px; }
        }
        .toast-box {
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .toast-box.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body class="text-slate-300 antialiased selection:bg-accent selection:text-base flex flex-col items-center justify-center min-h-screen py-12 relative overflow-x-hidden">

    <div class="fixed inset-[-50px] pointer-events-none z-0 dot-grid [mask-image:radial-gradient(ellipse_at_center,black_30%,transparent_80%)]" id="parallax-grid"></div>

    <div class="relative z-10 w-full max-w-sm mx-auto p-8 bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white tracking-tight">Tasker.</h1>
        </div>

        <div id="error" class="text-red-400 text-sm mb-4 p-3 bg-red-400/10 border border-red-400/20 rounded-lg text-center" style="display:none;"></div>

        <form method="POST" action="{{ url_for('signup') }}" class="space-y-4">
            <div>
                <input type="text" name="username" placeholder="Username" required class="w-full bg-slate-950/50 border border-slate-800 focus:border-accent/50 focus:ring-1 focus:ring-accent/50 text-white px-4 py-3 rounded-lg outline-none transition placeholder:text-slate-600">
            </div>

            <div>
                <input type="password" name="password" placeholder="Password" required class="w-full bg-slate-950/50 border border-slate-800 focus:border-accent/50 focus:ring-1 focus:ring-accent/50 text-white px-4 py-3 rounded-lg outline-none transition placeholder:text-slate-600">
            </div>

            <div>
                <input type="email" name="email" placeholder="Email" required class="w-full bg-slate-950/50 border border-slate-800 focus:border-accent/50 focus:ring-1 focus:ring-accent/50 text-white px-4 py-3 rounded-lg outline-none transition placeholder:text-slate-600">
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button type="submit" class="flex-1 bg-accent text-base font-semibold py-3 px-4 rounded-lg hover:bg-yellow-300 transition duration-200 shadow-[0_0_15px_rgba(252,211,77,0.15)] hover:shadow-[0_0_20px_rgba(252,211,77,0.3)]">
                    Request Access
                </button>

                <button type="button" class="group relative flex items-center justify-center cursor-help focus:outline-none">
                    <div class="w-12 h-12 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 flex items-center justify-center font-bold group-hover:bg-slate-700 group-hover:text-white group-focus:bg-slate-700 group-focus:text-white transition duration-200">
                        i
                    </div>
                    <div class="absolute bottom-full right-0 mb-3 w-64 p-4 bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-xl shadow-2xl opacity-0 group-hover:opacity-100 group-focus:opacity-100 transition-opacity duration-200 pointer-events-none z-20">
                        <p class="mb-2"><strong class="text-white">Email</strong> is used only for account status communication and feedback requests.</p>
                        <p><strong class="text-white">Credentials</strong> are private and never visible to the admin. Save them to your browser for convenient and safe access.</p>
                    </div>
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <a href="{{ url_for('login') }}" class="text-sm font-medium text-slate-400 hover:text-white transition-colors duration-200">Back to Login</a>
        </div>
    </div>

    <div id="toast" class="toast-box fixed bottom-8 left-1/2 z-50 w-max max-w-[90%] bg-slate-800 border border-slate-700 text-slate-200 px-5 py-3 rounded-lg shadow-2xl text-sm">
        Request submitted. You'll be notified by email when access is granted or denied.
    </div>

    <script>
        const form = document.querySelector("form");
        const toast = document.getElementById("toast");
        const errorBox = document.getElementById("error");
        const grid = document.getElementById('parallax-grid');

        if (window.matchMedia("(pointer: fine)").matches) {
            document.addEventListener('mousemove', (e) => {
                const xGrid = (e.clientX / window.innerWidth - 0.5) * 30;
                const yGrid = (e.clientY / window.innerHeight - 0.5) * 30;
                grid.style.transform = `translate(${xGrid * -1}px, ${yGrid * -1}px)`;
            });
        }
      
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          errorBox.textContent = "";
          errorBox.style.display = "none";
          const res = await fetch("/signup", {
            method: "POST",
            body: new FormData(form)
          });
          let data;
          try { data = await res.json(); } catch (err) { data = { ok: false, error: "Unexpected server response." }; }
          if (res.ok && data.ok) {
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 15000);
            form.reset();
          } else {
            errorBox.textContent = data.error || "Request failed. Try again.";
            errorBox.style.display = "block";
          }
        });
    </script>
</body>
</html>
