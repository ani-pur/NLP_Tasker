<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/pwa/manifest.webmanifest">
  <meta name="theme-color" content="#0a0f16">
  <title>Tasker.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { 
            base: '#0a0f16',      /* Deep matte midnight blue */
            panel: '#121924',     /* Slightly lighter matte container */
            surface: '#1e293b',   /* Slate-800 for borders */
            accent: '#fcd34d', 
            'accent-pressed': '#eab308' 
          }
        }
      }
    }
  </script>

  <style>
    body { 
      background-color: #0a0f16; 
      -webkit-tap-highlight-color: transparent; 
    }

    /* Slow, smooth staggered entrance */
    .task-enter {
      animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) both;
    }
    @keyframes slideUp {
      0%   { opacity: 0; transform: translateY(25px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Gentle breathing eyecandy for the clock separator */
    .pulse-slow {
      animation: softPulse 3s ease-in-out infinite;
    }
    @keyframes softPulse {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 1; text-shadow: 0 0 8px rgba(252,211,77,0.6); }
    }

    /* Accordion Logic */
    summary { list-style: none; }
    summary::-webkit-details-marker { display: none; }

    .task-details { animation: expand 0.25s cubic-bezier(0.23, 1, 0.32, 1); }
    @keyframes expand {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tap-active {
      transform: scale(0.97) !important;
      transition: transform 0.1s ease-out;
    }
    
    .btn-pressed {
      background-color: #eab308 !important; 
      transform: translateY(2px) scale(0.96);
      box-shadow: none !important;
    }
  </style>
</head>

<body class="text-slate-300 antialiased selection:bg-accent selection:text-base min-h-screen flex flex-col">

  <header class="w-full border-b border-white/5 bg-base/70 backdrop-blur-xl sticky top-0 z-50">
    <div class="px-5 h-14 flex items-center justify-between">
      <div class="text-2xl font-extrabold text-white tracking-tighter drop-shadow-sm">Tasker.</div>
      <div class="flex items-center gap-4 text-sm font-medium">
        <span class="text-slate-400 bg-white/5 border border-white/5 px-2 py-1 rounded-md shadow-inner">{{ username }}</span>
        <a href="{{ url_for('logout') }}" class="text-red-400 hover:text-red-300 transition pl-1 border-l border-white/10">Logout</a>
      </div>
    </div>
  </header>

  <main class="flex-grow w-full max-w-md mx-auto px-4 py-5 flex flex-col gap-6">
    
    <section class="bg-panel border border-surface rounded-2xl p-3 shadow-2xl">
      <h3 class="text-sm font-bold text-slate-200 mb-2 ml-1 tracking-wide">Describe Task</h3>
      <form id="taskForm" class="flex flex-col gap-2">
        <textarea 
          id="task_description" 
          maxlength="200" 
          class="w-full h-14 bg-base border border-surface focus:border-accent/70 text-slate-200 px-3 py-2 rounded-xl outline-none transition-colors placeholder:text-slate-600 resize-none font-medium text-sm shadow-inner"
        ></textarea>
        <button type="submit" id="addTaskBtn" class="w-full bg-accent text-slate-900 font-bold py-2.5 rounded-xl text-sm transition-all duration-150 shadow-[0_4px_14px_rgba(252,211,77,0.25)]">
          Add Task
        </button>
      </form>
    </section>

    <section class="flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-surface pb-2 px-1">
        <h2 class="text-lg font-bold text-white tracking-tight">Your Tasks</h2>
        <div class="inline-flex items-center gap-2 text-[11px] font-bold tabular-nums">
          <span id="clockDate" class="text-accent tracking-widest uppercase"></span>
          <span class="text-accent pulse-slow">|</span>
          <span id="clockTime" class="text-slate-300 tracking-widest"></span>
        </div>
      </div>
      
      <ul id="taskList" class="flex flex-col gap-3 pb-8"></ul>
    </section>

  </main>

  <script>
    const taskInput = document.getElementById('task_description');
    
    const prompts = [
      "gym next monday 7am legs, blue",
      "groceries in 2 hours yellow, milk eggs chicken rice",
      "submit project by Friday evening, orange",
      "call mom tomorrow at noon pink",
      "doctor appointment next tuesday 9am, red",
      "read 20 pages of book tonight, purple",
      "fix production bug before standup, green"
    ];
    taskInput.placeholder = 'Try: ' + prompts[Math.floor(Math.random() * prompts.length)];

    const colorMap = {
      blue: '#87CEEB', red: '#f05656', green: '#6CE5A9',
      pink: '#F8C8DC', orange: '#ff7f00', purple: '#A96CE5', yellow: '#FDDA0D'
    };

    taskInput.addEventListener('input', (e) => {
      const text = e.target.value.toLowerCase();
      const regex = /\b(blue|red|green|pink|orange|purple|yellow)\b/g;
      const matches = text.match(regex);
      
      if (matches && matches.length > 0) {
        const activeColor = matches[matches.length - 1];
        e.target.style.color = colorMap[activeColor];
      } else {
        e.target.style.color = '';
      }
    });

    const btn = document.getElementById('addTaskBtn');
    ['touchstart','mousedown'].forEach(e => btn.addEventListener(e, () => btn.classList.add('btn-pressed')));
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(e => btn.addEventListener(e, () => btn.classList.remove('btn-pressed')));

    let addTaskCooldown = false;
    const ADD_TASK_COOLDOWN_MS = 3000; 

    function buildUserTzMetadata() {
      const now = new Date();
      return {
        "todaysDate (yyyy/mm/dd): ": now.toLocaleDateString('en-CA'),
        "current time: ": now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
        "current day: ": now.toLocaleDateString('en-US', { weekday: 'long' })
      };
    }

    async function loadTasks() {
      const res = await fetch('/tasks');
      const tasks = await res.json();
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      tasks.forEach((task, index) => {
        const [id, __, name, time, desc, due, priority, color] = task;
        
        const dueDateDisplay = due ? due.replace(/ 00:00:00.*$/, '') : '';
        const timeDisplay = time ? ' • ' + time : '';
        const fullDateTime = `${dueDateDisplay}${timeDisplay}`.trim();

        const li = document.createElement('li');
        // Glossy, physical glass cards with a subtle top highlight and smooth shadows
        li.className = 'bg-black/20 border border-slate-800/40 rounded-xl px-4 py-4 transition-transform duration-100 ease-out';
        li.style.animationDelay = `${index * 60}ms`; // Slightly longer stagger for that smooth glide
        
        li.innerHTML = `
          <details class="group">
            <summary class="flex flex-col gap-1 outline-none cursor-pointer">
              <div class="font-bold text-[1.05rem] leading-tight drop-shadow-md" style="color:${color || '#fcd34d'}">${name}</div>
              ${fullDateTime ? `<div class="text-xs font-semibold text-sky-400/90 mt-0.5 tracking-wide">${fullDateTime}</div>` : ''}
            </summary>
            <div class="task-details mt-3 text-slate-300 text-sm leading-relaxed border-t border-white/5 pt-3">
              ${desc}
              <div class="mt-4 flex justify-end">
                <button class="text-red-400 font-bold text-[11px] tracking-widest uppercase px-5 py-2.5 bg-red-400/10 border border-red-400/20 active:bg-red-400/30 rounded-lg transition" onclick="deleteTask(${id})">
                  Delete
                </button>
              </div>
            </div>
          </details>
        `;

        addTapFeedback(li);
        list.appendChild(li);
      });
    }

    function addTapFeedback(el) {
      el.addEventListener('touchstart', () => el.classList.add('tap-active'), {passive: true});
      el.addEventListener('touchend', () => setTimeout(() => el.classList.remove('tap-active'), 50));
      el.addEventListener('touchcancel', () => el.classList.remove('tap-active'));
    }

    async function deleteTask(id) {
      const res = await fetch('/tasks/' + id, { method: 'DELETE' });
      if (res.ok) loadTasks();
    }

    document.getElementById('taskForm').addEventListener('submit', async e => {
      e.preventDefault();

      if (addTaskCooldown) return;
      addTaskCooldown = true;
      setTimeout(() => { addTaskCooldown = false; }, ADD_TASK_COOLDOWN_MS);
      
      const desc = taskInput.value;
      if (desc.length < 10 || desc.length > 200) return alert('Task description must be 10 to 200 characters');

      const res = await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          task_description: desc,
          user_tz_metadata: buildUserTzMetadata()
        })
      });

      if (res.ok) {
        taskInput.value = '';
        taskInput.style.color = ''; 
        taskInput.placeholder = 'Try: ' + prompts[Math.floor(Math.random() * prompts.length)];
        loadTasks();
      } else {
        alert('Failed to add task');
      }
    });

    // Clock Logic
    function renderClock(animate=false){
      const now = new Date();
      const date = now.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" }).toUpperCase();
      const time = now.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit" });
    
      const elDate = document.getElementById("clockDate");
      const elTime = document.getElementById("clockTime");
    
      if (!elDate || !elTime) return;
    
      elDate.textContent = date;
      elTime.textContent = time;
    }
    
    renderClock(false);

    function scheduleNextClockTick(){
      const now = Date.now();
      const msToNextMinute = 60000 - (now % 60000);
      const bufferMs = 80;

      setTimeout(() => {
        renderClock(true);
        scheduleNextClockTick();
      }, msToNextMinute + bufferMs);
    }

    scheduleNextClockTick();

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) renderClock(false);
    });
    
    // Initial Load
    loadTasks();
  </script>
</body>
</html>
