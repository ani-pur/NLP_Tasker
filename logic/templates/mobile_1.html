<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/pwa/manifest.webmanifest">
  <meta name="theme-color" content="#111520">
  <title>Tasker.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { base: '#111520', accent: '#fcd34d', 'accent-pressed': '#eab308' }
        }
      }
    }
  </script>

  <style>
    body { 
      background-color: #111520; 
      -webkit-tap-highlight-color: transparent; 
    }

    /* Clock snap animation */
    .snap { animation: snap 180ms ease-out; }
    @keyframes snap {
      0%   { opacity: 0; transform: translateY(-4px) scale(1.05); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Staggered slide-up for tasks */
    .task-enter {
      animation: slideUp 0.5s cubic-bezier(0.23, 1, 0.32, 1) both;
    }
    @keyframes slideUp {
      0%   { opacity: 0; transform: translateY(20px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Faster pulsing clock separator */
    .pulse-fast {
      animation: fastPulse 1.5s ease-in-out infinite;
    }
    @keyframes fastPulse {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 1; text-shadow: 0 0 8px rgba(252,211,77,0.8); }
    }

    /* Custom Accordion Logic */
    summary {
      list-style: none; 
    }
    summary::-webkit-details-marker {
      display: none; 
    }

    .task-details {
      animation: expand 0.2s ease-out;
    }
    @keyframes expand {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Tap Feedback Classes */
    .tap-active {
      background-color: rgba(0, 0, 0, 0.4) !important; 
      transform: scale(0.985);
    }
    
    .btn-pressed {
      background-color: #eab308 !important; 
      transform: translateY(1px) scale(0.98);
    }
  </style>
</head>
<body class="text-slate-300 antialiased selection:bg-accent selection:text-base min-h-screen flex flex-col">

  <header class="w-full border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-xl sticky top-0 z-50">
    <div class="px-5 h-16 flex items-center justify-between">
      <div class="relative inline-block">
        <select onchange="if(this.value)window.location=this.value" style="appearance:none;-webkit-appearance:none;background:transparent;border:none;font-size:1.5rem;font-weight:800;letter-spacing:-0.05em;color:white;cursor:pointer;padding-right:20px;outline:none;font-family:'Inter',sans-serif;">
          <option value="" selected>Tasker.</option>
          <option value="/switch/5">Editorial</option>
          <option value="/switch/6">Glass</option>
          <option value="/switch/8">Midnight</option>
        </select>
        <svg style="position:absolute;right:2px;top:50%;transform:translateY(-50%);pointer-events:none;" class="text-accent" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="flex items-center gap-4 text-sm font-medium">
        <span class="text-slate-400 bg-slate-800/50 px-2 py-1 rounded-md">{{ username }}</span>
        <button id="notifBtn" onclick="setupPushNotifications()" class="hidden text-slate-500 hover:text-accent transition p-1" title="Enable notifications">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        </button>
        <a href="{{ url_for('logout') }}" class="text-red-400 hover:text-red-300 transition pl-1 border-l border-slate-700">Logout</a>
      </div>
    </div>
  </header>

  <main class="flex-grow w-full max-w-md mx-auto px-4 py-6 flex flex-col gap-8">
    
    <section class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-xl relative overflow-hidden">
      <h3 class="text-base font-bold text-white mb-3">Describe Task</h3>
      <form id="taskForm" class="flex flex-col gap-3">
        <textarea 
          id="task_description" 
          maxlength="200" 
          class="w-full h-20 bg-slate-950/50 border border-slate-800 focus:border-accent/50 focus:ring-1 focus:ring-accent/50 text-slate-200 px-4 py-3 rounded-xl outline-none transition-colors placeholder:text-slate-600 resize-none font-medium text-sm"
        ></textarea>
        <span id="reminderPreview" class="hidden text-xs font-semibold text-amber-400/90 bg-amber-900/20 border border-amber-800/30 px-2.5 py-1 rounded-md self-start">🔔 <span id="reminderValue"></span></span>
        <button type="submit" id="addTaskBtn" class="w-full bg-accent text-slate-900 font-bold py-3 px-4 rounded-xl transition duration-150 shadow-lg">
          Add Task
        </button>
      </form>
    </section>

    <section class="flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 px-1">
        <h2 class="text-xl font-bold text-white tracking-tight">Your Tasks</h2>
        <div class="inline-flex items-center gap-2 text-xs font-bold tabular-nums">
          <span id="clockDate" class="text-accent tracking-widest uppercase"></span>
          <span class="text-accent pulse-fast">|</span>
          <span id="clockTime" class="text-slate-300 tracking-widest"></span>
        </div>
      </div>
      
      <ul id="taskList" class="flex flex-col gap-3 pb-8"></ul>
    </section>

  </main>

  <script>
    // --- UI/UX Enhancements ---
    const taskInput = document.getElementById('task_description');
    
    // Dynamic Placeholders
    const prompts = [
      "gym next monday 7am legs, blue",
      "groceries in 2 hours yellow, milk eggs chicken rice",
      "submit project by Friday evening, orange",
      "call mom tomorrow at noon pink",
      "doctor appointment next tuesday 9am, red",
      "read 20 pages of book tonight, purple",
      "fix production bug before standup, green"
    ];
    taskInput.placeholder = 'Try: ' + prompts[Math.floor(Math.random() * prompts.length)];

    // Real-time Hex Parsing
    const colorMap = {
      blue: '#87CEEB',
      red: '#f05656',
      green: '#6CE5A9',
      pink: '#F8C8DC',
      orange: '#ff7f00',
      purple: '#A96CE5',
      yellow: '#FDDA0D'
    };

    function extractColor(text) {
      const matches = text.toLowerCase().match(/\b(blue|red|green|pink|orange|purple|yellow)\b/g);
      if (matches && matches.length > 0) return colorMap[matches[matches.length - 1]];
      return '#FFFFFF';
    }

    function parseReminder(text) {
      const t = text.toLowerCase();
      // relative: "remind me 30 min before", "notify 2 hours prior"
      const rel = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?(\d+)\s*(m|min|mins|minute|minutes|h|hr|hrs|hour|hours)\b/);
      if (rel) {
        const val = parseInt(rel[1]);
        const unit = rel[2];
        if (unit.startsWith('h')) {
          const clamped = Math.min(val, 24);
          return { offsetHours: clamped, absoluteTime: null, display: `${clamped}h` };
        } else {
          const hours = val / 60;
          const clamped = Math.min(hours, 24);
          return { offsetHours: clamped, absoluteTime: null, display: `${val}m` };
        }
      }
      // absolute: "remind at 2pm", "remind me at 3:30am"
      const abs = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?at\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
      if (abs) {
        const hour = parseInt(abs[1]);
        const mins = abs[2] ? parseInt(abs[2]) : 0;
        const period = abs[3].toUpperCase();
        const display = mins > 0 ? `${hour}:${String(mins).padStart(2,'0')}${period}` : `${hour}${period}`;
        const absoluteTime = `${hour}:${String(mins).padStart(2,'0')} ${period}`;
        return { offsetHours: null, absoluteTime, display };
      }
      return { offsetHours: 0, absoluteTime: null, display: null };
    }

    taskInput.addEventListener('input', (e) => {
      const text = e.target.value.toLowerCase();
      const regex = /\b(blue|red|green|pink|orange|purple|yellow)\b/g;
      const matches = text.match(regex);

      if (matches && matches.length > 0) {
        const activeColor = matches[matches.length - 1];
        e.target.style.color = colorMap[activeColor];
      } else {
        e.target.style.color = '';
      }
      // reminder preview
      const reminder = parseReminder(e.target.value);
      const preview = document.getElementById('reminderPreview');
      if (reminder.display) {
        document.getElementById('reminderValue').textContent = reminder.display;
        preview.classList.remove('hidden');
      } else {
        preview.classList.add('hidden');
      }
    });

    // Mobile Button Press Feedback
    const btn = document.getElementById('addTaskBtn');
    ['touchstart','mousedown'].forEach(e => btn.addEventListener(e, () => btn.classList.add('btn-pressed')));
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(e => btn.addEventListener(e, () => btn.classList.remove('btn-pressed')));

    // --- Core Tasker Logic ---
    let addTaskCooldown = false;
    const ADD_TASK_COOLDOWN_MS = 3000; 

    function buildUserTzMetadata() {
      const now = new Date();
      return {
        "todaysDate (yyyy/mm/dd): ": now.toLocaleDateString('en-CA'),
        "current time: ": now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
        "current day: ": now.toLocaleDateString('en-US', { weekday: 'long' }),
        "utc_offset_minutes": now.getTimezoneOffset()
      };
    }

    async function loadTasks() {
      try {
        const res = await fetch('/tasks');
        const tasks = await res.json();
        const list = document.getElementById('taskList');
        list.innerHTML = '';

        const now = new Date();
        const pastDueTasks = [];
        const upcomingTasks = [];

        // 1. Sort using our fixed AM/PM string parser
        tasks.forEach(task => {
          const [id, __, name, time, desc, due, color, reminder_display] = task;
          let isPastDue = false;

          if (due) {
            const cleanDate = due.replace(/ 00:00:00.*$/, '').trim(); 
            const timeStr = time ? time.trim() : '11:59 PM'; 
            const taskDateTime = new Date(`${cleanDate} ${timeStr}`);
            
            if (!isNaN(taskDateTime) && taskDateTime < now) {
              isPastDue = true;
            }
          }

          if (isPastDue) pastDueTasks.push(task);
          else upcomingTasks.push(task);
        });

        // 2. Render Helper
    const appendTaskToDOM = (task, isPastDue, animationIndex) => {
      const [id, __, name, time, desc, due, color, reminder_display] = task;
      
      const dueDateDisplay = due ? due.replace(/ 00:00:00.*$/, '') : '';
      const timeDisplay = time ? ' • ' + time : '';
      const fullDateTime = `${dueDateDisplay}${timeDisplay}`.trim();

      const li = document.createElement('li');
      
      // FIX 1: Use standard Tailwind shadows instead of arbitrary RGBA, and add list-none
      const containerBorder = isPastDue 
        ? 'border-red-900/50 shadow-lg shadow-red-900/20' 
        : 'border-slate-800/40';
        
      li.className = `list-none task-enter bg-black/20 border ${containerBorder} rounded-xl px-4 py-4 transition-transform duration-100 ease-out transform-gpu`;
      li.style.animationDelay = `${animationIndex * 50}ms`;
      
      // FIX 2: Drop the arbitrary drop-shadow text effect causing layout flashes
      const dateStyle = isPastDue 
        ? 'text-red-400 font-semibold' 
        : 'text-sky-300/80';

      li.innerHTML = `
        <details class="group">
          <summary class="flex flex-col gap-1 outline-none cursor-pointer">
            <div class="font-bold text-[1.05rem] leading-tight" style="color:${color || '#fcd34d'}">${name}</div>
            <div class="flex items-center gap-1.5 mt-0.5">
              ${fullDateTime ? `<span class="text-xs font-medium ${dateStyle}">${fullDateTime}</span>` : ''}
              ${reminder_display ? `<span class="text-xs font-semibold text-amber-400/80 bg-amber-900/20 border border-amber-800/30 px-1.5 py-0.5 rounded" title="Reminder">🔔 ${reminder_display}</span>` : ''}
            </div>
          </summary>
          <div class="task-details mt-3 text-slate-400 text-sm leading-relaxed border-t border-slate-800/40 pt-3">
            ${desc}
            <div class="mt-4 flex justify-end">
              <button class="text-red-400 font-bold text-xs tracking-widest uppercase px-5 py-2.5 bg-red-400/10 active:bg-red-400/20 rounded-lg transition" onclick="deleteTask(${id})">
                Delete
              </button>
            </div>
          </div>
        </details>
      `;

      addTapFeedback(li);
      list.appendChild(li);
    };

    // 3. Inject into the DOM sequentially 
    let staggerIndex = 0;

    pastDueTasks.forEach(task => {
      appendTaskToDOM(task, true, staggerIndex++);
    });

    if (pastDueTasks.length > 0) {
      const divider = document.createElement('li');
      // FIX 3: Add list-none to the divider and standard shadows
      divider.className = "list-none relative flex items-center py-4 w-full";
      divider.innerHTML = `
        <div class="flex-grow border-t border-red-500/50 shadow-sm shadow-red-500/50"></div>
        <span class="shrink-0 mx-3 px-3 py-1 bg-slate-900 text-red-400 text-[0.65rem] font-bold tracking-widest uppercase border border-red-500/50 rounded-full shadow-sm shadow-red-500/30">
          Past Due
        </span>
        <div class="flex-grow border-t border-red-500/50 shadow-sm shadow-red-500/50"></div>
      `;
      list.appendChild(divider);
    }

    upcomingTasks.forEach(task => {
      appendTaskToDOM(task, false, staggerIndex++);
    });

      } catch (err) {
        console.error("Error loading tasks:", err);
      }
    }

    function addTapFeedback(el) {
      el.addEventListener('touchstart', () => el.classList.add('tap-active'), {passive: true});
      el.addEventListener('touchend', () => setTimeout(() => el.classList.remove('tap-active'), 50));
      el.addEventListener('touchcancel', () => el.classList.remove('tap-active'));
    }

    async function deleteTask(id) {
      const res = await fetch('/tasks/' + id, { method: 'DELETE' });
      if (res.ok) loadTasks();
    }

    document.getElementById('taskForm').addEventListener('submit', async e => {
      e.preventDefault();

      if (addTaskCooldown) return;
      addTaskCooldown = true;
      setTimeout(() => { addTaskCooldown = false; }, ADD_TASK_COOLDOWN_MS);
      
      const desc = taskInput.value;
      if (desc.length < 10 || desc.length > 200) return alert('Task description must be 10–200 characters');

      const reminder = parseReminder(desc);
      const res = await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          task_description: desc,
          user_tz_metadata: buildUserTzMetadata(),
          color: extractColor(desc),
          notif_time_offset: reminder.offsetHours,
          notif_absolute_time: reminder.absoluteTime,
          reminder_display: reminder.display
        })
      });

      if (res.ok) {
        taskInput.value = '';
        taskInput.style.color = '';
        document.getElementById('reminderPreview').classList.add('hidden');
        taskInput.placeholder = 'Try: ' + prompts[Math.floor(Math.random() * prompts.length)];
        loadTasks();
      } else {
        alert('Failed to add task');
      }
    });

    // --- Clock Logic ---
    function renderClock(animate=false){
      const now = new Date();
      const date = now.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" }).toUpperCase();
      const time = now.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit" });
    
      const elDate = document.getElementById("clockDate");
      const elTime = document.getElementById("clockTime");
    
      if (!elDate || !elTime) return;
    
      elDate.textContent = date;
      elTime.textContent = time;
    
      if (animate){
        elTime.classList.remove("snap");
        void elTime.offsetWidth; 
        elTime.classList.add("snap");
      }
    }
    
    renderClock(false);

    function scheduleNextClockTick(){
      const now = Date.now();
      const msToNextMinute = 60000 - (now % 60000);
      const bufferMs = 80;

      setTimeout(() => {
        renderClock(true);
        scheduleNextClockTick();
      }, msToNextMinute + bufferMs);
    }

    scheduleNextClockTick();

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) renderClock(false);
    });
    
    // --- Push Notifications ---
    async function setupPushNotifications() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

      const btn = document.getElementById('notifBtn');

      try {
        const reg = await navigator.serviceWorker.register('/sw.js');

        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;

        const existing = await reg.pushManager.getSubscription();
        if (existing) { if (btn) btn.classList.add('hidden'); return; }

        const keyRes = await fetch('/push/vapid-public-key');
        const keyData = await keyRes.json();
        if (!keyData.public_key) return;

        const rawKey = atob(keyData.public_key.replace(/-/g, '+').replace(/_/g, '/'));
        const vapidKey = new Uint8Array(rawKey.length);
        for (let i = 0; i < rawKey.length; i++) vapidKey[i] = rawKey.charCodeAt(i);

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: vapidKey
        });

        const subJson = sub.toJSON();
        await fetch('/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            endpoint: subJson.endpoint,
            keys: subJson.keys
          })
        });

        if (btn) btn.classList.add('hidden');
      } catch (err) {
        console.error('Push setup failed:', err);
      }
    }

    // Show notification bell if push is supported but not yet subscribed
    async function initNotifButton() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (Notification.permission === 'granted') {
        const reg = await navigator.serviceWorker.getRegistration('/sw.js');
        if (reg) {
          const existing = await reg.pushManager.getSubscription();
          if (existing) return; // already subscribed, keep hidden
        }
      }
      const btn = document.getElementById('notifBtn');
      if (btn) btn.classList.remove('hidden');
    }

    // Initial Load
    loadTasks();
    initNotifButton();
  </script>
</body>
</html>
