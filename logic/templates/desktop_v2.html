<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tasker 2.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Honk&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('/static/dark_rainforest.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Roboto', sans-serif;
        }
        .glass-container {
            background: rgba(0, 0, 0, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 40px 32px;
            max-width: 1000px;
            width: 90%;
            margin: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .honk-text {
            font-family: 'Honk', system-ui, sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 0.5em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .logout-link {
            position: static;
            color: #4f8cff;
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            z-index: 10;
        }
        .logout-link:hover {
            color: #6ed0fa;
        }
        h2, h3 {
            color: #fff;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            font-weight: 400;
        }
        ul#taskList {
            width: 100%;
            max-width: 800px;
            padding: 0;
            margin: 0 0 1.5em 0;
            list-style: none;
        }
        ul#taskList li {
            background: rgba(255,255,255,0.18);
            border-radius: 18px;
            margin-bottom: 14px;
            padding: 16px 18px;
            color: #222;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: background 0.2s;
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        ul#taskList li:hover {
            background: rgba(255,255,255,0.28);
        }
        details summary {
            cursor: pointer;
            font-weight: 500;
            color: #222;
        }
        form {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        form label {
            color: #fff;
            font-size: 1rem;
            margin-bottom: 8px;
            font-weight: 400;
            width: 100%;
            text-align: left;
        }
        form input,
        form select,
        form textarea {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.18);
            color: #222;
            font-size: 1rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            outline: none;
            transition: background 0.2s;
            display: block;
            margin: 0 auto;
        }
        form input[type="color"] {
            padding: 2px 4px;
            height: 40px;
            width: 48px;
            min-width: 48px;
            max-width: 48px;
            background: none;
            border: none;
            flex-shrink: 0;
        }
        .color-row {
            width: 100%;
            display: flex;
            align-items: left;
            gap: 12px;
            margin-bottom: 0;
            max-width: 100%;
        }
        .color-row label {
            margin-bottom: 0;
            width: auto;
            text-align: left;
            flex: 0 0 auto;
        }
        .color-row input[type="color"] {
            flex: 0 0 auto;
        }
        form input:focus, form select:focus, form textarea:focus {
            background: rgba(255,255,255,0.28);
        }
        .checkbox-row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0;
        }
        .checkbox-row label {
            margin-bottom: 0;
            width: auto;
            text-align: left;
        }
        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
        }
        .session-actions {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            gap: 14px;
        }
        #time_fields {
            width: 100%;
        }
        button[type="submit"] {
            background-color: #FDB927; /* Lakers gold */
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: background-color 0.25s;
            width: 20%;
            max-width: 250px;
        }

        button[type="submit"]:hover {
            background-color: #552583; /* Lakers purple */
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .edit-modal {
            width: 420px; max-width: 100%; background: rgba(20,20,24,0.92);
            border: 1px solid rgba(255,255,255,0.18); border-radius: 20px; padding: 24px;
            backdrop-filter: blur(20px) saturate(160%);
            box-shadow: 0 24px 60px -20px rgba(0,0,0,0.8);
        }
        .edit-modal h3 { color: #fff; margin: 0 0 16px; font-weight: 700; }
        .edit-modal label { display: block; color: #cbd5e1; font-size: 0.8rem; margin: 12px 0 6px; }
        .edit-modal input, .edit-modal textarea {
            width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 8px 10px;
            color: #fff; font-size: 0.9rem; outline: none;
        }
        .edit-modal textarea { height: 70px; resize: none; }
        .edit-modal .row { display: flex; gap: 10px; }
        .edit-modal .row > div { flex: 1; }
        .edit-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .edit-btn-ghost, .edit-btn-save {
            border-radius: 10px; padding: 8px 16px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; border: none;
        }
        .edit-btn-ghost { background: rgba(255,255,255,0.12); color: #fff; }
        .edit-btn-save { background: #FDB927; color: #222; }
        @media (max-width: 600px) {
            .glass-container {
                padding: 18px 6px;
                max-width: 98vw;
            }
            h1 {
                font-size: 2rem;
            }
            form {
                max-width: 100%;
            }
            ul#taskList, ul#taskList li {
                max-width: 100%;
            }
            button[type="submit"] {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="glass-container" style="position:relative;">

        <div class="session-actions">
            <select onchange="if(this.value)window.location=this.value" class="logout-link" style="background:rgba(255,255,255,0.18);border:none;border-radius:8px;padding:6px 12px;color:#4f8cff;font-size:0.95rem;cursor:pointer;">
              <option value="" selected>Theme: OG (Retired)</option>
              <option value="/switch/3">Default</option>
              <option value="/switch/5">Editorial</option>
              <option value="/switch/6">Glass</option>
            </select>
            <a href="{{ url_for('calendar') }}" class="logout-link" style="color:inherit;">Calendar</a>
            <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
        </div>
        <h1 class="honk-text">Welcome, {{ username }}!</h1>
        <div style="margin-bottom: 1em; text-align: center;">
            <label for="bgSelector" style="color: white; font-weight: 500;">Choose Background:</label>
            <select id="bgSelector" style="margin-left: 8px; padding: 6px 12px; border-radius: 8px;">
                <option value="/static/dark_rainforest.jpg">Rainforest</option>
                <option value="/static/abstractminimal.jpg">abstract</option>
                <option value="/static/macOS_minimal.jpg">macOS</option>
                <option value="none">dark</option>
            </select>
        </div>
        <h2>Your Tasks</h2>
        <ul id="taskList"></ul>
        <h3>Add New Task</h3>
        <form id="taskForm" autocomplete="off">

            <label for="task_description">Task Description</label>
            <textarea id="task_description" placeholder="Task Description" style="resize: vertical;"></textarea>
            <span id="reminderPreview" style="display:none; font-size:0.85rem; font-weight:600; color:#fbbf24; background:rgba(120,53,15,0.25); border:1px solid rgba(120,53,15,0.4); border-radius:8px; padding:4px 10px; align-self:flex-start; transition:all 0.2s;">🔔 <span id="reminderValue"></span></span>
            <button type="submit">Add Task</button>
        </form>
    </div>

    <!-- Edit task modal -->
    <div class="modal-overlay" id="editModal">
      <div class="edit-modal">
        <h3>Edit Task</h3>
        <input type="hidden" id="editId">
        <label>Name</label>
        <input type="text" id="editName" maxlength="120" placeholder="Task name">
        <label>Description</label>
        <textarea id="editDesc" maxlength="200" placeholder="Details"></textarea>
        <div class="row">
          <div>
            <label>Date</label>
            <input type="date" id="editDate">
          </div>
          <div>
            <label>Time</label>
            <input type="time" id="editTime">
          </div>
        </div>
        <label>Color</label>
        <input type="color" id="editColor" value="#ffffff">
        <div class="edit-modal-actions">
          <button type="button" class="edit-btn-ghost" onclick="closeEdit()">Cancel</button>
          <button type="button" class="edit-btn-save" onclick="saveEdit()">Save changes</button>
        </div>
      </div>
    </div>

    <script>

        
        /* ---------- COLOR ---------- */
        const colorMap = { blue:'#60a5fa', red:'#f87171', green:'#4ade80', pink:'#f472b6', orange:'#fb923c', purple:'#c084fc', yellow:'#facc15' };
        function extractColor(text) {
            const matches = text.toLowerCase().match(/\b(blue|red|green|pink|orange|purple|yellow)\b/g);
            if (matches && matches.length > 0) return colorMap[matches[matches.length - 1]];
            return '#FFFFFF';
        }

        function cleanDescription(text, reminder, color) {
            let cleaned = text;
            if (reminder && reminder.display) {
                cleaned = cleaned.replace(/(?:,\s*)?(?:remind|notify|alert)\s+(?:me\s+)?(?:in\s+)?\d+\s*(?:m|mi|min|minu|minut|minute|minutes|h|ho|hou|hour|hours|hr|hrs)\b/gi, '');
                cleaned = cleaned.replace(/(?:,\s*)?(?:remind|notify|alert)\s+(?:me\s+)?at\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/gi, '');
            }
            if (color && color !== '#FFFFFF') {
                cleaned = cleaned.replace(/\b(blue|red|green|pink|orange|purple|yellow)\b/gi, '');
            }
            return cleaned.replace(/,\s*,/g, ',').replace(/\s{2,}/g, ' ').replace(/^[,\s]+|[,\s]+$/g, '').trim();
        }

        /* ---------- REMINDER ---------- */
        function parseReminder(text) {
            const t = text.toLowerCase();
            const rel = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?(\d+)\s*(m|mi|min|minu|minut|minute|minutes|h|ho|hou|hour|hours|hr|hrs)\b/);
            if (rel) {
                const val = parseInt(rel[1]);
                const unit = rel[2];
                if (unit.startsWith('h')) {
                    const clamped = Math.min(val, 24);
                    return { offsetHours: clamped, absoluteTime: null, display: `${clamped}h` };
                } else {
                    const hours = val / 60;
                    const clamped = Math.min(hours, 24);
                    return { offsetHours: clamped, absoluteTime: null, display: `${val}m` };
                }
            }
            // relative to now: "remind me in 30 min", "notify me in 2 hours"
            const relIn = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?in\s+(\d+)\s*(m|mi|min|minu|minut|minute|minutes|h|ho|hou|hour|hours|hr|hrs)\b/);
            if (relIn) {
                const val = parseInt(relIn[1]);
                const unit = relIn[2];
                const ms = unit.startsWith('h') ? val * 3600000 : val * 60000;
                const target = new Date(Date.now() + ms);
                let h = target.getHours(), m = target.getMinutes();
                const period = h >= 12 ? 'PM' : 'AM';
                h = h % 12 || 12;
                const display = m > 0 ? `${h}:${String(m).padStart(2,'0')}${period}` : `${h}${period}`;
                const absoluteTime = `${h}:${String(m).padStart(2,'0')} ${period}`;
                return { offsetHours: null, absoluteTime, display };
            }
            const abs = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?at\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
            if (abs) {
                const hour = parseInt(abs[1]);
                const mins = abs[2] ? parseInt(abs[2]) : 0;
                const period = abs[3].toUpperCase();
                const display = mins > 0 ? `${hour}:${String(mins).padStart(2,'0')}${period}` : `${hour}${period}`;
                const absoluteTime = `${hour}:${String(mins).padStart(2,'0')} ${period}`;
                return { offsetHours: null, absoluteTime, display };
            }
            return { offsetHours: 0, absoluteTime: null, display: null };
        }

        /* ---------- USER TZ METADATA ---------- */
        function buildUserTzMetadata() {
            const now = new Date();
            return {
                "todaysDate (yyyy/mm/dd): ": now.toLocaleDateString('en-CA'),
                "current time: ": ` ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })} `,
                "current day: ": ` ${now.toLocaleDateString('en-US', { weekday: 'long' })} `,
                "utc_offset_minutes": now.getTimezoneOffset()
            };
        }


        function setBackground(imageUrl) {
            const body = document.body;
            if (imageUrl === "none") {
                body.style.background = "#111";
            } else {
                body.style.background = `url('${imageUrl}') no-repeat center center fixed`;
                body.style.backgroundSize = "cover";
            }
            localStorage.setItem("bgImage", imageUrl);
        }

        document.getElementById('bgSelector').addEventListener('change', function() {
            const selected = this.value;
            setBackground(selected);
        });

        const savedBg = localStorage.getItem("bgImage");
        if (savedBg) {
            document.getElementById("bgSelector").value = savedBg;
            setBackground(savedBg);
        }

        let currentTasks = [];                 // last fetched rows, used by the edit modal

        async function loadTasks() {
            const response = await fetch('/tasks');
            const tasks = await response.json();
            currentTasks = tasks;
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            tasks.forEach(task => {
                
                const [id, __, task_name, task_time, task_description, due_date, color, reminder_display] = task;

                // Handle due_date if it's like "2025-06-27T00:00:00" 
                let dueDateDisplay = due_date
                    ? due_date.replace(/ 00:00:00.*$/, '')
                    : "";



                // Render
                const li = document.createElement('li');
                li.innerHTML = `
                    <details>
                        <summary>
                            <strong style="color: ${color};">${task_name}</strong>
                            <span style="margin-left:6px; color:#9ca3af; font-size:0.85rem;">${dueDateDisplay}${task_time ? ' ' + task_time : ''}</span>
                            ${reminder_display ? `<span style="margin-left:8px; font-size:0.8rem; font-weight:600; color:#fbbf24; background:rgba(120,53,15,0.25); border:1px solid rgba(120,53,15,0.4); border-radius:6px; padding:2px 8px;">🔔 ${reminder_display}</span>` : ''}
                        </summary>
                        <div style="margin-left: 10px;">
                            <div style="margin: 8px 0; color: #222;">
                                <div><b>Description:</b> ${task_description}</div>
                                <div><b>Color:</b> <span style="background-color: ${color}; padding: 0 10px; border-radius: 6px;">${color}</span></div>
                            </div>
                            <button onclick="openEdit(${id})" style="background: #4f8cff; color: #fff; border-radius: 8px; border: none; padding: 6px 16px; margin-top: 8px; margin-right: 8px; cursor: pointer;">Edit</button>
                            <button onclick="deleteTask(${id})" style="background: #ff4f4f; color: #fff; border-radius: 8px; border: none; padding: 6px 16px; margin-top: 8px; cursor: pointer;">Delete</button>
                        </div>
                    </details>
                `;
                taskList.appendChild(li);
            });
        }



        async function deleteTask(taskId) {
            const response = await fetch('/tasks/' + taskId, {
                method: 'DELETE'
            });
            if (response.ok) {
                loadTasks();
            } else {
                alert('Failed to delete task');
            }
        }

        document.getElementById('task_description').addEventListener('input', (e) => {
            const text = e.target.value;
            const matches = text.toLowerCase().match(/\b(blue|red|green|pink|orange|purple|yellow)\b/g);
            e.target.style.color = matches ? colorMap[matches[matches.length - 1]] : '';
            const reminder = parseReminder(text);
            const preview = document.getElementById('reminderPreview');
            if (reminder.display) {
                document.getElementById('reminderValue').textContent = reminder.display;
                preview.style.display = 'inline-block';
            } else {
                preview.style.display = 'none';
            }
        });

        document.getElementById('taskForm').addEventListener('submit', async e => {
            e.preventDefault();

            const description = document.getElementById('task_description').value;

            if (description.length < 10 || description.length > 200) {
                alert('Task description must be 10–200 characters');
                return;
            }

            const reminder = parseReminder(description);
            const color = extractColor(description);
            const cleanedDesc = cleanDescription(description, reminder, color);
            document.getElementById('reminderPreview').style.display = 'none';

            const response = await fetch('/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    task_description: cleanedDesc,
                    user_tz_metadata: buildUserTzMetadata(),
                    color: color,
                    notif_time_offset: reminder.offsetHours,
                    notif_absolute_time: reminder.absoluteTime,
                    reminder_display: reminder.display
                })
            });

            if (response.ok) {
                document.getElementById('task_description').value = '';
                document.getElementById('task_description').style.color = '';
                loadTasks();
            } else {
                alert('Failed to add task');
            }
        });


        /* ---------- EDIT TASK ---------- */
        const EDIT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

        // due_date arrives as "Thu, 14 Mar 2026 00:00:00 GMT"; pull it back to a yyyy-mm-dd
        // value for <input type=date>. Parse at local noon so a tz shift can't roll the day.
        function dueToInput(due) {
            if (!due) return '';
            const c = due.replace(/ 00:00:00.*$/, '').trim();
            const d = new Date(c + ' 12:00');
            if (isNaN(d)) return '';
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
        function timeTo24(t) {
            if (!t) return '';
            const m = t.trim().match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
            if (!m) return '';
            let h = parseInt(m[1]) % 12;
            if (/pm/i.test(m[3])) h += 12;
            return `${String(h).padStart(2,'0')}:${m[2]}`;
        }
        function inputToDue(v) {
            if (!v) return null;
            const [y, mo, d] = v.split('-').map(Number);
            return `${String(d).padStart(2,'0')} ${EDIT_MONTHS[mo-1]} ${y}`;
        }
        function input24ToTime(v) {
            if (!v) return null;
            let [h, m] = v.split(':').map(Number);
            const p = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${String(m).padStart(2,'0')} ${p}`;
        }
        function openEdit(id) {
            const t = currentTasks.find(x => x[0] === id);
            if (!t) return;
            const [, , name, time, desc, due, color] = t;
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = name || '';
            document.getElementById('editDesc').value = desc || '';
            document.getElementById('editDate').value = dueToInput(due);
            document.getElementById('editTime').value = timeTo24(time);
            document.getElementById('editColor').value = color || '#ffffff';
            document.getElementById('editModal').classList.add('open');
        }
        function closeEdit() { document.getElementById('editModal').classList.remove('open'); }
        async function saveEdit() {
            const id = document.getElementById('editId').value;
            const body = {
                task_name: document.getElementById('editName').value.trim(),
                task_description: document.getElementById('editDesc').value.trim(),
                due_date: inputToDue(document.getElementById('editDate').value),
                task_time: input24ToTime(document.getElementById('editTime').value),
                color: document.getElementById('editColor').value,
                user_tz_metadata: buildUserTzMetadata()
            };
            if (!body.task_name) { alert('Task name is required'); return; }
            if (body.task_description.length > 200) { alert('Description too long (max 200)'); return; }
            const res = await fetch('/tasks/' + id, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
            });
            if (res.ok) { closeEdit(); loadTasks(); }
            else { const e = await res.json().catch(() => ({})); alert(e.error || 'Failed to update task'); }
        }
        document.getElementById('editModal').addEventListener('click', e => {
            if (e.target.id === 'editModal') closeEdit();
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEdit(); });

        loadTasks();
    </script>
</body>
</html>
