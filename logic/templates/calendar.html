<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Calendar | Tasker.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.14);
      --fg: #e4e4e7;
      --muted: #71717a;
      --accent: #818cf8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Gradient mesh background (matches dashboard v6) ── */
    .mesh-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .mesh-orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.5; animation: float 20s ease-in-out infinite; }
    .mesh-orb:nth-child(1) { width: 500px; height: 500px; background: radial-gradient(circle, #818cf850 0%, transparent 70%); top: -10%; left: -5%; }
    .mesh-orb:nth-child(2) { width: 600px; height: 600px; background: radial-gradient(circle, #f4364c30 0%, transparent 70%); bottom: -15%; right: -10%; animation-delay: -7s; }
    .mesh-orb:nth-child(3) { width: 400px; height: 400px; background: radial-gradient(circle, #06b6d420 0%, transparent 70%); top: 40%; left: 50%; animation-delay: -14s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* ── Header ── */
    header {
      flex-shrink: 0; z-index: 50; padding: 16px 32px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(5,5,8,0.6); backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-decoration: none;
    }
    .nav-links { display: flex; align-items: center; gap: 18px; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--fg); }
    .nav-links a.active { color: var(--accent); }
    .nav-links a.exit { color: #f87171; }
    .user-chip {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
      color: var(--accent); background: rgba(129,140,248,0.1);
      border: 1px solid rgba(129,140,248,0.2); padding: 5px 14px; border-radius: 8px;
    }

    /* ── Layout ── */
    main {
      width: 100%; max-width: 1280px; margin: 0 auto; padding: 28px 32px 48px;
      position: relative; z-index: 1; flex: 1;
    }

    /* ── Calendar toolbar ── */
    .cal-toolbar {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
    }
    .cal-title-wrap { display: flex; align-items: baseline; gap: 14px; }
    .cal-month {
      font-size: 34px; font-weight: 800; letter-spacing: -1.2px;
      background: linear-gradient(135deg, #e4e4e7, #a1a1aa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .cal-year { font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: var(--accent); font-weight: 600; }

    .cal-controls { display: flex; align-items: center; gap: 8px; }
    .nav-btn {
      width: 38px; height: 38px; display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
      color: var(--fg); cursor: pointer; transition: all 0.18s;
    }
    .nav-btn:hover { background: var(--surface-hover); border-color: var(--border-hover); transform: translateY(-1px); }
    .nav-btn:active { transform: translateY(0); }
    .today-btn {
      height: 38px; padding: 0 18px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 11px; color: var(--fg); cursor: pointer; font-family: 'IBM Plex Mono', monospace;
      font-size: 12px; font-weight: 600; transition: all 0.18s;
    }
    .today-btn:hover { background: rgba(129,140,248,0.12); border-color: rgba(129,140,248,0.3); color: var(--accent); }

    /* ── Grid ── */
    .weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 10px;
    }
    .weekday {
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-align: center;
    }
    .grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;
    }
    .day-cell {
      position: relative; min-height: 116px; padding: 10px;
      background: var(--surface); backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid var(--border); border-radius: 14px;
      transition: all 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer; overflow: hidden; display: flex; flex-direction: column;
      animation: cellIn 0.4s cubic-bezier(0.23, 1, 0.32, 1) both;
    }
    @keyframes cellIn { 0% { opacity: 0; transform: translateY(10px) scale(0.97); } 100% { opacity: 1; transform: none; } }
    .day-cell:hover { background: var(--surface-hover); border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 10px 30px -12px rgba(0,0,0,0.6); }
    .day-cell.empty { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
    .day-cell.today { border-color: rgba(129,140,248,0.45); box-shadow: 0 0 0 1px rgba(129,140,248,0.25), 0 8px 30px -10px rgba(129,140,248,0.4); }
    .day-cell.has-overdue::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(120px 80px at 100% 0%, rgba(248,113,113,0.10), transparent 70%);
    }

    .day-num {
      font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;
      color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;
    }
    .today .day-num .n {
      color: #fff; background: linear-gradient(135deg, #818cf8, #6366f1);
      width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px;
    }
    .day-num .more { font-size: 10px; color: var(--accent); }

    .chips { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
    .chip {
      display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
      padding: 3px 7px; border-radius: 7px; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: all 0.15s;
    }
    .chip:hover { background: rgba(255,255,255,0.08); }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .chip.overdue { opacity: 0.65; text-decoration: line-through; }
    .chip .label { overflow: hidden; text-overflow: ellipsis; }

    /* ── Stats row ── */
    .stats-strip { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
    .stat-box {
      flex: 1; min-width: 120px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 18px;
    }
    .stat-value { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 2px; }

    /* ── Day detail slide-over ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px);
      z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .panel {
      position: fixed; top: 0; right: 0; height: 100%; width: 420px; max-width: 90vw; z-index: 100;
      background: rgba(10,10,14,0.85); backdrop-filter: blur(30px) saturate(160%);
      border-left: 1px solid var(--border); padding: 28px; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column;
    }
    .panel.open { transform: none; }
    .panel-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .panel-date { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .panel-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 3px; }
    .panel-close {
      width: 34px; height: 34px; display: grid; place-items: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .panel-close:hover { color: #f87171; border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.08); }

    .p-task {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 10px; position: relative; overflow: hidden;
      animation: cellIn 0.3s ease both;
    }
    .p-task .pbar { position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; }
    .p-task-name { font-size: 15px; font-weight: 700; padding-left: 10px; }
    .p-task-desc { color: var(--muted); font-size: 13px; line-height: 1.55; margin-top: 4px; padding-left: 10px; }
    .p-task-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-left: 10px; gap: 8px; }
    .time-pill {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: var(--muted);
      background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px;
    }
    .time-pill.overdue { color: #f87171; background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.2); }
    .reminder-badge {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: #fbbf24;
      background: rgba(120,53,15,0.2); border: 1px solid rgba(251,191,36,0.2); padding: 5px 10px; border-radius: 6px;
    }
    .del-btn {
      background: none; border: 1px solid transparent; color: var(--muted);
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; cursor: pointer; padding: 4px 10px; border-radius: 6px; transition: all 0.15s;
    }
    .del-btn:hover { color: #f87171; background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.2); }
    .panel-empty { text-align: center; color: var(--muted); padding: 50px 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px; }

    /* ── Responsive / mobile ── */
    @media (max-width: 720px) {
      header { padding: 14px 18px; }
      .nav-links { gap: 12px; }
      main { padding: 20px 14px 40px; }
      .cal-month { font-size: 26px; }
      .grid, .weekdays { gap: 5px; }
      .day-cell { min-height: 92px; padding: 5px; border-radius: 11px; }
      .day-num { font-size: 11px; margin-bottom: 3px; }
      /* keep compact text chips on phones (truncated) instead of bare dots,
         so each day still shows a hint of what's on it */
      .chip { padding: 2px 4px; font-size: 8.5px; gap: 3px; border-radius: 5px; line-height: 1.2; }
      .chip .dot { width: 5px; height: 5px; }
      .chips { gap: 3px; }
      .panel { width: 100%; max-width: 100vw; }
    }
  </style>
</head>
<body>

  <div class="mesh-bg">
    <div class="mesh-orb"></div>
    <div class="mesh-orb"></div>
    <div class="mesh-orb"></div>
  </div>

  <header>
    <a href="{{ url_for('index') }}" class="logo">tasker.</a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}">Tasks</a>
      <a href="{{ url_for('calendar') }}" class="active">Calendar</a>
      <span class="user-chip">{{ username }}</span>
      <a href="{{ url_for('logout') }}" class="exit">Exit</a>
    </div>
  </header>

  <main>
    <div class="cal-toolbar">
      <div class="cal-title-wrap">
        <span class="cal-month" id="calMonth">—</span>
        <span class="cal-year" id="calYear"></span>
      </div>
      <div class="cal-controls">
        <button class="today-btn" id="todayBtn">Today</button>
        <button class="nav-btn" id="prevBtn" aria-label="Previous month">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="nav-btn" id="nextBtn" aria-label="Next month">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <div class="weekdays" id="weekdays"></div>
    <div class="grid" id="grid"></div>

    <div class="stats-strip">
      <div class="stat-box"><div class="stat-value" style="color:#818cf8;" id="statMonth">0</div><div class="stat-label">This Month</div></div>
      <div class="stat-box"><div class="stat-value" style="color:#f87171;" id="statOverdue">0</div><div class="stat-label">Overdue</div></div>
      <div class="stat-box"><div class="stat-value" style="color:#34d399;" id="statTotal">0</div><div class="stat-label">Total Tasks</div></div>
    </div>
  </main>

  <!-- Day detail slide-over -->
  <div class="overlay" id="overlay"></div>
  <aside class="panel" id="panel">
    <div class="panel-head">
      <div>
        <div class="panel-date" id="panelDate">—</div>
        <div class="panel-sub" id="panelSub"></div>
      </div>
      <button class="panel-close" id="panelClose" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="panelBody"></div>
  </aside>

  <script>
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    let allTasks = [];                       // raw rows from /tasks
    let tasksByDay = {};                     // 'YYYY-M-D' -> [parsed task]
    let viewYear, viewMonth;                 // currently displayed month
    let selectedKey = null;                  // open day key (to refresh panel after delete)

    // weekday header (built once)
    const wd = document.getElementById('weekdays');
    WEEKDAYS.forEach(d => { const el = document.createElement('div'); el.className = 'weekday'; el.textContent = d; wd.appendChild(el); });

    const dayKey = (y, m, d) => `${y}-${m}-${d}`;

    // Parse a task row into a normalized object. Mirrors the dashboard's date logic:
    // due_date arrives as "DD Mon YYYY 00:00:00..." (or similar) and task_time as "HH:MM AM".
    function parseTask(row) {
      const [id, , name, time, desc, due, color, reminder] = row;
      let y = null, mo = null, d = null, dt = null;
      if (due) {
        const cleanDate = due.replace(/ 00:00:00.*$/, '').trim();
        const timeStr = time ? time.trim() : '11:59 PM';
        dt = new Date(`${cleanDate} ${timeStr}`);
        if (!isNaN(dt)) { y = dt.getFullYear(); mo = dt.getMonth(); d = dt.getDate(); }
      }
      return { id, name, time, desc, due, color: color || '#818cf8', reminder, y, mo, d, dt,
               overdue: dt && !isNaN(dt) && dt < new Date() };
    }

    function indexTasks() {
      tasksByDay = {};
      allTasks.forEach(row => {
        const t = parseTask(row);
        if (t.y === null) return;            // undated tasks don't land on the grid
        const k = dayKey(t.y, t.mo, t.d);
        (tasksByDay[k] ||= []).push(t);
      });
      // sort each day's tasks chronologically (by full datetime)
      Object.values(tasksByDay).forEach(arr => arr.sort((a, b) => a.dt - b.dt));
    }

    function renderStats() {
      let monthCount = 0, overdue = 0;
      Object.entries(tasksByDay).forEach(([k, arr]) => {
        const [y, m] = k.split('-').map(Number);
        if (y === viewYear && m === viewMonth) monthCount += arr.length;
      });
      allTasks.forEach(row => { if (parseTask(row).overdue) overdue++; });
      document.getElementById('statMonth').textContent = monthCount;
      document.getElementById('statOverdue').textContent = overdue;
      document.getElementById('statTotal').textContent = allTasks.length;
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      document.getElementById('calMonth').textContent = MONTHS[viewMonth];
      document.getElementById('calYear').textContent = viewYear;

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();   // 0=Sun
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const today = new Date();
      const isThisMonth = today.getFullYear() === viewYear && today.getMonth() === viewMonth;

      // leading blanks so the 1st lands on the right weekday
      for (let i = 0; i < firstDay; i++) {
        const e = document.createElement('div');
        e.className = 'day-cell empty';
        grid.appendChild(e);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const k = dayKey(viewYear, viewMonth, d);
        const dayTasks = tasksByDay[k] || [];
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.style.animationDelay = `${Math.min(d * 8, 200)}ms`;
        if (isThisMonth && d === today.getDate()) cell.classList.add('today');
        if (dayTasks.some(t => t.overdue)) cell.classList.add('has-overdue');

        const MAX_CHIPS = window.innerWidth <= 720 ? 2 : 3;
        const extra = dayTasks.length - MAX_CHIPS;

        let chipsHtml = dayTasks.slice(0, MAX_CHIPS).map(t => `
          <div class="chip ${t.overdue ? 'overdue' : ''}" title="${escapeHtml(t.name)}">
            <span class="dot" style="background:${t.color};"></span>
            <span class="label" style="color:${t.color};">${escapeHtml(t.name)}</span>
          </div>`).join('');

        cell.innerHTML = `
          <div class="day-num">
            <span class="n">${d}</span>
            ${extra > 0 ? `<span class="more">+${extra}</span>` : ''}
          </div>
          <div class="chips">${chipsHtml}</div>
        `;
        cell.addEventListener('click', () => openDay(viewYear, viewMonth, d));
        grid.appendChild(cell);
      }

      renderStats();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    /* ── Day detail panel ── */
    function openDay(y, m, d) {
      selectedKey = dayKey(y, m, d);
      const dt = new Date(y, m, d);
      document.getElementById('panelDate').textContent = `${MONTHS[m].slice(0,3)} ${d}`;
      document.getElementById('panelSub').textContent = dt.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric' }).toUpperCase();
      renderPanelBody();
      document.getElementById('overlay').classList.add('open');
      document.getElementById('panel').classList.add('open');
    }

    function renderPanelBody() {
      const body = document.getElementById('panelBody');
      const dayTasks = tasksByDay[selectedKey] || [];
      if (dayTasks.length === 0) {
        body.innerHTML = `<div class="panel-empty">NO TASKS THIS DAY</div>`;
        return;
      }
      body.innerHTML = dayTasks.map(t => `
        <div class="p-task">
          <div class="pbar" style="background:${t.color};"></div>
          <div class="p-task-name" style="color:${t.color};">${escapeHtml(t.name)}</div>
          ${t.desc ? `<div class="p-task-desc">${escapeHtml(t.desc)}</div>` : ''}
          <div class="p-task-foot">
            <div style="display:flex;gap:6px;align-items:center;">
              <span class="time-pill ${t.overdue ? 'overdue' : ''}">${t.time ? escapeHtml(t.time) : 'All day'}</span>
              ${t.reminder ? `<span class="reminder-badge">🔔 ${escapeHtml(t.reminder)}</span>` : ''}
            </div>
            <button class="del-btn" data-id="${t.id}">delete</button>
          </div>
        </div>`).join('');

      body.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteTask(parseInt(btn.dataset.id)));
      });
    }

    function closePanel() {
      document.getElementById('overlay').classList.remove('open');
      document.getElementById('panel').classList.remove('open');
      selectedKey = null;
    }

    /* ── Data ── */
    async function fetchTasks() {
      try {
        const res = await fetch('/tasks');
        allTasks = await res.json();
        indexTasks();
        renderGrid();
        if (selectedKey) renderPanelBody();   // keep open panel fresh after a delete
      } catch (err) { console.error('Error loading tasks:', err); }
    }

    async function deleteTask(id) {
      const res = await fetch('/tasks/' + id, { method: 'DELETE' });
      if (res.ok) fetchTasks();
      else alert('Failed to delete task');
    }

    /* ── Navigation ── */
    function shiftMonth(delta) {
      viewMonth += delta;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      else if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderGrid();
    }
    function goToday() {
      const n = new Date();
      viewYear = n.getFullYear(); viewMonth = n.getMonth();
      renderGrid();
    }

    document.getElementById('prevBtn').addEventListener('click', () => shiftMonth(-1));
    document.getElementById('nextBtn').addEventListener('click', () => shiftMonth(1));
    document.getElementById('todayBtn').addEventListener('click', goToday);
    document.getElementById('overlay').addEventListener('click', closePanel);
    document.getElementById('panelClose').addEventListener('click', closePanel);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closePanel();
      else if (e.key === 'ArrowLeft') shiftMonth(-1);
      else if (e.key === 'ArrowRight') shiftMonth(1);
    });

    // init
    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    renderGrid();
    fetchTasks();
  </script>
</body>
</html>
