<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Dashboard | Tasker.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.14);
      --fg: #e4e4e7;
      --muted: #71717a;
      --accent: #818cf8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Gradient mesh background ── */
    .mesh-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .mesh-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.5;
      animation: float 20s ease-in-out infinite;
    }

    .mesh-orb:nth-child(1) {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #818cf850 0%, transparent 70%);
      top: -10%; left: -5%;
      animation-delay: 0s;
    }

    .mesh-orb:nth-child(2) {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #f4364c30 0%, transparent 70%);
      bottom: -15%; right: -10%;
      animation-delay: -7s;
    }

    .mesh-orb:nth-child(3) {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #06b6d420 0%, transparent 70%);
      top: 40%; left: 50%;
      animation-delay: -14s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* ── Header ── */
    header {
      flex-shrink: 0;
      z-index: 50;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5,5,8,0.6);
      backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--fg); }
    .nav-links a.exit { color: #f87171; }

    .user-chip {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(129,140,248,0.1);
      border: 1px solid rgba(129,140,248,0.2);
      padding: 5px 14px;
      border-radius: 8px;
    }

    /* ── Layout ── */
    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 32px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 32px;
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; padding: 20px 16px; }
    }

    @media (max-width: 768px) {
      body {
        height: auto;
        overflow: auto;
      }
      main {
        overflow: visible;
      }
    }

    .task-section {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #taskList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-width: none;
}
    #taskList::-webkit-scrollbar { display: none; }

    /* ── Section header ── */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .task-count-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      margin-left: 12px;
      vertical-align: middle;
    }

    .clock-display {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 17px;
      color: var(--muted);
      text-align: right;
      line-height: 1.6;
    }

    .clock-display .date { color: var(--accent); font-weight: 600; }

    /* ── Task cards — THE GLASS ── */
    .task-card {
      background: var(--surface);
      backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 20px;
      margin-bottom: 10px;
      transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .task-card:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .task-card .color-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 120px;
      height: 100%;
      opacity: 0.07;
      filter: blur(40px);
      pointer-events: none;
    }

    .task-card .color-bar {
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 3px;
      border-radius: 0 3px 3px 0;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding-left: 12px;
    }

    .task-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      line-height: 1.3;
    }

    .task-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-top: 4px;
      padding-left: 12px;
    }

    .task-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 6px;
      padding-left: 12px;
    }

    .task-badges {
      flex-shrink: 0;
    }

    .time-pill {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .time-pill.overdue {
      color: #f87171;
      background: rgba(248,113,113,0.08);
      border-color: rgba(248,113,113,0.2);
    }

    .reminder-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: #fbbf24;
      background: rgba(120,53,15,0.2);
      border: 1px solid rgba(251,191,36,0.2);
      padding: 6px 12px;
      border-radius: 6px;
      margin-left: 6px;
      backdrop-filter: blur(8px);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .delete-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      opacity: 0;
      transition: all 0.15s;
    }

    .task-card:hover .delete-btn { opacity: 1; }

    .delete-btn:hover {
      color: #f87171;
      background: rgba(248,113,113,0.1);
      border-color: rgba(248,113,113,0.2);
    }

    /* ── Past due divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(248,113,113,0.3), transparent);
    }

    .divider-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f87171;
      white-space: nowrap;
    }

    /* ── Input panel ── */
    .input-panel {
      overflow-y: auto;
    }

    .input-card {
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
    }

    .input-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .input-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      color: var(--fg);
      resize: none;
      outline: none;
      transition: all 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(129,140,248,0.1);
    }

    textarea::placeholder { color: #3f3f46; }

    .input-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .char-counter {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .submit-btn {
      background: linear-gradient(135deg, #818cf8, #6366f1);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 24px;
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 12px rgba(129,140,248,0.25);
    }

    .submit-btn:hover {
      box-shadow: 0 4px 20px rgba(129,140,248,0.4);
      transform: translateY(-1px);
    }

    .submit-btn:active { transform: translateY(0); }

    /* ── Stats strip below input ── */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* ── Edit modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 440px; max-width: 100%; background: rgba(12,12,16,0.96);
      border: 1px solid var(--border); border-radius: 20px; padding: 26px;
      backdrop-filter: blur(30px) saturate(160%);
      box-shadow: 0 24px 60px -20px rgba(0,0,0,0.8);
      animation: modalIn 0.22s cubic-bezier(0.23, 1, 0.32, 1);
    }
    @keyframes modalIn { 0% { opacity: 0; transform: translateY(12px) scale(0.97); } 100% { opacity: 1; transform: none; } }
    .modal h3 { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 18px; }
    .modal label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin: 14px 0 6px; }
    .modal input, .modal textarea {
      width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; font-family: 'Sora', sans-serif; font-size: 14px;
      color: var(--fg); outline: none; transition: all 0.2s;
    }
    .modal input:focus, .modal textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(129,140,248,0.1); }
    .modal textarea { height: 80px; resize: none; }
    .modal input[type="date"], .modal input[type="time"] { color-scheme: dark; }
    .modal .row { display: flex; gap: 12px; }
    .modal .row > div { flex: 1; }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
    .swatch:hover { transform: scale(1.12); }
    .swatch.selected { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
    .swatch.none { background: linear-gradient(135deg, #2a2a30, #18181c); position: relative; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .btn-ghost { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 10px; padding: 9px 18px; font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.18s; }
    .btn-ghost:hover { color: var(--fg); border-color: var(--border-hover); }
    .btn-save { background: linear-gradient(135deg, #818cf8, #6366f1); color: #fff; border: none; border-radius: 10px; padding: 9px 22px; font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 12px rgba(129,140,248,0.25); transition: all 0.18s; }
    .btn-save:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(129,140,248,0.4); }

    /* ── Dropdown readability ── */
    select option {
      background: #0c0c10;
      color: #e4e4e7;
      -webkit-text-fill-color: #e4e4e7;
    }
  </style>
</head>
<body>

  <div class="mesh-bg">
    <div class="mesh-orb"></div>
    <div class="mesh-orb"></div>
    <div class="mesh-orb"></div>
  </div>

  <header>
    <div class="logo" style="position:relative;display:inline-block;">
      <select onchange="if(this.value)window.location=this.value" style="appearance:none;-webkit-appearance:none;background:transparent;border:none;font-size:22px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;cursor:pointer;padding-right:22px;outline:none;">
        <option value="" selected>tasker.</option>
        <option value="/switch/2">OG (Retired)</option>
        <option value="/switch/3">Default</option>
        <option value="/switch/5">Editorial</option>
      </select>
      <svg style="position:absolute;right:2px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--accent);" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="nav-links">
      <a href="{{ url_for('calendar') }}">Calendar</a>
      <span class="user-chip">{{ username }}</span>
      <a href="{{ url_for('logout') }}" class="exit">Exit</a>
    </div>
  </header>

  <main>
    <div class="task-section">
      <div class="section-header">
        <div>
          <span class="section-title">Tasks</span>
          <span class="task-count-badge" id="taskCountBadge">0</span>
        </div>
        <div class="clock-display">
          <div class="date" id="clockDate"></div>
          <div id="clockTime"></div>
        </div>
      </div>
      <div id="taskList"></div>
    </div>

    <div class="input-panel">
      <div class="input-card">
        <div class="input-title">New Task</div>
        <div class="input-subtitle">Just type. Dates, times, colors - Tasker extracts everything.</div>
        <textarea id="taskInput" placeholder="gym next monday 7am legs, blue"></textarea>
        <div class="input-actions">
          <span class="char-counter" id="charCounter">0/200</span>
          <span id="reminderPreview" style="display:none; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:#fbbf24; background:rgba(120,53,15,0.2); border:1px solid rgba(251,191,36,0.2); padding:6px 12px; border-radius:6px; backdrop-filter:blur(8px);">🔔 <span id="reminderValue"></span></span>
          <button class="submit-btn" id="submitBtn">Add Task</button>
        </div>
      </div>

      <div class="stats-strip">
        <div class="stat-box">
          <div class="stat-value" style="color:#818cf8;" id="statActive">0</div>
          <div class="stat-label">Active</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" style="color:#f87171;" id="statOverdue">0</div>
          <div class="stat-label">Overdue</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" style="color:#34d399;" id="statTotal">0</div>
          <div class="stat-label">Total</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    /* ── Clock ── */
    let clockTimer;
    function renderClock(animate = false) {
      const now = new Date();
      const day = now.toLocaleDateString(undefined, { weekday: 'short' }).toUpperCase();
      const mon = now.toLocaleDateString(undefined, { month: 'short' }).toUpperCase();
      const d = String(now.getDate()).padStart(2, '0');
      document.getElementById('clockDate').textContent = `${day}, ${mon} ${d}`;
      document.getElementById('clockTime').textContent = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: true });
    }
    function scheduleNextClockTick() {
      if (clockTimer) clearTimeout(clockTimer);
      const msToNextMinute = (60000 - (Date.now() % 60000)) + 80;
      clockTimer = setTimeout(() => { renderClock(true); scheduleNextClockTick(); }, msToNextMinute);
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { renderClock(false); scheduleNextClockTick(); }
    });
    renderClock(false);
    scheduleNextClockTick();

    /* ── Color ── */
    const prompts = ["gym next monday 7am legs, blue", "groceries in 2 hours yellow, milk eggs chicken rice", "submit project by Friday evening, orange", "call mom tomorrow at noon pink", "doctor appointment next tuesday 9am, red", "read 20 pages of book tonight, purple", "fix production bug before standup, green"];
    document.getElementById('taskInput').placeholder = 'Try: ' + prompts[Math.floor(Math.random() * prompts.length)];
    const colorMap = { blue: '#87CEEB', red: '#f05656', green: '#6CE5A9', pink: '#F8C8DC', orange: '#ff7f00', purple: '#A96CE5', yellow: '#FDDA0D' };
    function extractColor(text) {
      const matches = text.toLowerCase().match(/\b(blue|red|green|pink|orange|purple|yellow)\b/g);
      if (matches && matches.length > 0) return colorMap[matches[matches.length - 1]];
      return '#FFFFFF';
    }

    function cleanDescription(text, reminder, color) {
      let cleaned = text;
      if (reminder && reminder.display) {
        cleaned = cleaned.replace(/(?:,\s*)?(?:remind|notify|alert)\s+(?:me\s+)?(?:in\s+)?\d+\s*(?:m|mi|min|minu|minut|minute|minutes|h|ho|hou|hour|hours|hr|hrs)\b/gi, '');
        cleaned = cleaned.replace(/(?:,\s*)?(?:remind|notify|alert)\s+(?:me\s+)?at\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/gi, '');
      }
      if (color && color !== '#FFFFFF') {
        cleaned = cleaned.replace(/\b(blue|red|green|pink|orange|purple|yellow)\b/gi, '');
      }
      return cleaned.replace(/,\s*,/g, ',').replace(/\s{2,}/g, ' ').replace(/^[,\s]+|[,\s]+$/g, '').trim();
    }

    /* ── Reminder ── */
    function parseReminder(text) {
      const t = text.toLowerCase();
      const rel = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?(\d+)\s*(m|mi|min|minu|minut|minute|minutes|h|ho|hou|hour|hours|hr|hrs)\b/);
      if (rel) {
        const val = parseInt(rel[1]);
        const unit = rel[2];
        if (unit.startsWith('h')) {
          const clamped = Math.min(val, 24);
          return { offsetHours: clamped, absoluteTime: null, display: `${clamped}h` };
        } else {
          const hours = val / 60;
          const clamped = Math.min(hours, 24);
          return { offsetHours: clamped, absoluteTime: null, display: `${val}m` };
        }
      }
      // relative to now: "remind me in 30 min", "notify me in 2 hours"
      const relIn = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?in\s+(\d+)\s*(m|mi|min|minu|minut|minute|minutes|h|ho|hou|hour|hours|hr|hrs)\b/);
      if (relIn) {
        const val = parseInt(relIn[1]);
        const unit = relIn[2];
        const ms = unit.startsWith('h') ? val * 3600000 : val * 60000;
        const target = new Date(Date.now() + ms);
        let h = target.getHours(), m = target.getMinutes();
        const period = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        const display = m > 0 ? `${h}:${String(m).padStart(2,'0')}${period}` : `${h}${period}`;
        const absoluteTime = `${h}:${String(m).padStart(2,'0')} ${period}`;
        return { offsetHours: null, absoluteTime, display };
      }
      const abs = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?at\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
      if (abs) {
        const hour = parseInt(abs[1]);
        const mins = abs[2] ? parseInt(abs[2]) : 0;
        const period = abs[3].toUpperCase();
        const display = mins > 0 ? `${hour}:${String(mins).padStart(2,'0')}${period}` : `${hour}${period}`;
        const absoluteTime = `${hour}:${String(mins).padStart(2,'0')} ${period}`;
        return { offsetHours: null, absoluteTime, display };
      }
      return { offsetHours: 0, absoluteTime: null, display: null };
    }

    let addTaskCooldown = false;
    const ADD_TASK_COOLDOWN_MS = 3000;

    /* ── TZ metadata ── */
    function buildUserTzMetadata() {
      const now = new Date();
      return {
        "todaysDate (yyyy/mm/dd): ": now.toLocaleDateString('en-CA'),
        "current time: ": ` ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })} `,
        "current day: ": ` ${now.toLocaleDateString('en-US', { weekday: 'long' })} `,
        "utc_offset_minutes": now.getTimezoneOffset()
      };
    }

    /* ── Render tasks ── */
    let currentTasks = [];                 // last fetched rows, used by the edit modal
    function renderTasks(tasks) {
      currentTasks = tasks;
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      const now = new Date();
      const upcoming = [], pastDue = [];
      tasks.forEach(task => {
        const [id, __, task_name, task_time, task_description, due_date, color, reminder_display] = task;
        let isPast = false;
        if (due_date) {
          const cleanDate = due_date.replace(/ 00:00:00.*$/, '').trim();
          const timeStr = task_time ? task_time.trim() : '11:59 PM';
          const taskDateTime = new Date(`${cleanDate} ${timeStr}`);
          if (!isNaN(taskDateTime) && taskDateTime < now) isPast = true;
        }
        if (isPast) pastDue.push(task); else upcoming.push(task);
      });

      document.getElementById('taskCountBadge').textContent = tasks.length;
      document.getElementById('statActive').textContent = upcoming.length;
      document.getElementById('statOverdue').textContent = pastDue.length;
      document.getElementById('statTotal').textContent = tasks.length;

      if (tasks.length === 0) {
        list.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;"><span style="font-size:48px;font-weight:800;color:var(--muted);opacity:0.15;">0</span><span style="font-family:IBM Plex Mono,monospace;font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px;">No tasks</span></div>';
        return;
      }

      function renderCard(task) {
        const [id, __, task_name, task_time, task_description, due_date, color, reminder_display] = task;
        const dueDateDisplay = due_date ? due_date.replace(/ 00:00:00.*$/, '') : '';
        const isPast = (() => { if (!due_date) return false; const d = new Date(`${due_date.replace(/ 00:00:00.*$/, '').trim()} ${task_time ? task_time.trim() : '11:59 PM'}`); return !isNaN(d) && d < new Date(); })();
        const card = document.createElement('div');
        card.className = 'task-card';
        card.innerHTML = `
          <div class="color-glow" style="background:${color};"></div>
          <div class="color-bar" style="background:${color};"></div>
          <div class="task-header">
            <div class="task-name" style="color:${color};">${task_name}</div>
            <div class="task-badges" style="display:flex;align-items:center;gap:6px;">
              ${reminder_display ? `<span class="reminder-badge">🔔 ${reminder_display}</span>` : ''}
              <span class="time-pill${isPast ? ' overdue' : ''}">${dueDateDisplay}${task_time ? ' · ' + task_time : ''}</span>
            </div>
          </div>
          <div class="task-desc">${task_description}</div>
          <div class="task-footer">
            <button class="delete-btn" onclick="openEdit(${id})">edit</button>
            <button class="delete-btn" onclick="deleteTask(${id})">delete</button>
          </div>
        `;
        list.appendChild(card);
      }

      if (pastDue.length > 0) {
        pastDue.forEach(renderCard);
        const divider = document.createElement('div');
        divider.className = 'divider';
        divider.innerHTML = `<span class="divider-label">Past Due</span>`;
        list.appendChild(divider);
      }

      upcoming.forEach(renderCard);
    }

    /* ── Fetch / Delete ── */
    async function fetchTasks() {
      try {
        const res = await fetch('/tasks');
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (err) { console.error('Error loading tasks:', err); }
    }

    async function deleteTask(id) {
      const res = await fetch('/tasks/' + id, { method: 'DELETE' });
      if (res.ok) fetchTasks();
      else alert('Failed to delete task');
    }

    /* ── Input listener ── */
    document.getElementById('taskInput').addEventListener('input', (e) => {
      const text = e.target.value;
      document.getElementById('charCounter').textContent = `${text.length}/200`;
      const matches = text.toLowerCase().match(/\b(blue|red|green|pink|orange|purple|yellow)\b/g);
      e.target.style.color = matches ? colorMap[matches[matches.length - 1]] : '';
      const reminder = parseReminder(text);
      const preview = document.getElementById('reminderPreview');
      if (reminder.display) {
        document.getElementById('reminderValue').textContent = reminder.display;
        preview.style.display = 'inline-block';
      } else {
        preview.style.display = 'none';
      }
    });

    /* ── Submit ── */
    document.getElementById('submitBtn').addEventListener('click', async () => {
      if (addTaskCooldown) return;
      addTaskCooldown = true;
      setTimeout(() => { addTaskCooldown = false; }, ADD_TASK_COOLDOWN_MS);
      const desc = document.getElementById('taskInput').value.trim();
      if (desc.length < 10 || desc.length > 200) {
        alert('Task description must be 10–200 characters');
        return;
      }
      const reminder = parseReminder(desc);
      const color = extractColor(desc);
      const cleanedDesc = cleanDescription(desc, reminder, color);
      document.getElementById('reminderPreview').style.display = 'none';
      const res = await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          task_description: cleanedDesc,
          user_tz_metadata: buildUserTzMetadata(),
          color: color,
          notif_time_offset: reminder.offsetHours,
          notif_absolute_time: reminder.absoluteTime,
          reminder_display: reminder.display
        })
      });
      if (res.ok) {
        const input = document.getElementById('taskInput');
        input.value = '';
        input.style.color = '';
        document.getElementById('charCounter').textContent = '0/200';
        fetchTasks();
        document.getElementById('taskInput').placeholder = 'Try: ' + prompts[Math.floor(Math.random() * prompts.length)];
      } else {
        alert('Failed to add task');
      }
    });

    /* ── Push Notifications ── */
    async function setupPushNotifications() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;
        const existing = await reg.pushManager.getSubscription();
        if (existing) return;
        const keyRes = await fetch('/push/vapid-public-key');
        const keyData = await keyRes.json();
        if (!keyData.public_key) return;
        const rawKey = atob(keyData.public_key.replace(/-/g, '+').replace(/_/g, '/'));
        const vapidKey = new Uint8Array(rawKey.length);
        for (let i = 0; i < rawKey.length; i++) vapidKey[i] = rawKey.charCodeAt(i);
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidKey });
        const subJson = sub.toJSON();
        await fetch('/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: subJson.endpoint, keys: subJson.keys }) });
      } catch (err) { console.error('Push setup failed:', err); }
    }

    /* ── Edit task ── */
    const EDIT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let selectedEditColor = '#FFFFFF';

    // due_date arrives as "Thu, 14 Mar 2026 00:00:00 GMT"; pull it back to a yyyy-mm-dd
    // value for <input type=date>. Parse at local noon so a tz shift can't roll the day.
    function dueToInput(due) {
      if (!due) return '';
      const c = due.replace(/ 00:00:00.*$/, '').trim();
      const d = new Date(c + ' 12:00');
      if (isNaN(d)) return '';
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function timeTo24(t) {
      if (!t) return '';
      const m = t.trim().match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
      if (!m) return '';
      let h = parseInt(m[1]) % 12;
      if (/pm/i.test(m[3])) h += 12;
      return `${String(h).padStart(2,'0')}:${m[2]}`;
    }
    function inputToDue(v) {
      if (!v) return null;
      const [y, mo, d] = v.split('-').map(Number);
      return `${String(d).padStart(2,'0')} ${EDIT_MONTHS[mo-1]} ${y}`;
    }
    function input24ToTime(v) {
      if (!v) return null;
      let [h, m] = v.split(':').map(Number);
      const p = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${String(m).padStart(2,'0')} ${p}`;
    }
    function selectEditColor(hex) {
      selectedEditColor = hex || '#FFFFFF';
      document.querySelectorAll('#editModal .swatch').forEach(s => {
        s.classList.toggle('selected', s.dataset.color.toLowerCase() === selectedEditColor.toLowerCase());
      });
    }
    function openEdit(id) {
      const t = currentTasks.find(x => x[0] === id);
      if (!t) return;
      const [, , name, time, desc, due, color] = t;
      document.getElementById('editId').value = id;
      document.getElementById('editName').value = name || '';
      document.getElementById('editDesc').value = desc || '';
      document.getElementById('editDate').value = dueToInput(due);
      document.getElementById('editTime').value = timeTo24(time);
      selectEditColor(color || '#FFFFFF');
      document.getElementById('editModal').classList.add('open');
    }
    function closeEdit() { document.getElementById('editModal').classList.remove('open'); }
    async function saveEdit() {
      const id = document.getElementById('editId').value;
      const body = {
        task_name: document.getElementById('editName').value.trim(),
        task_description: document.getElementById('editDesc').value.trim(),
        due_date: inputToDue(document.getElementById('editDate').value),
        task_time: input24ToTime(document.getElementById('editTime').value),
        color: selectedEditColor,
        user_tz_metadata: buildUserTzMetadata()
      };
      if (!body.task_name) { alert('Task name is required'); return; }
      if (body.task_description.length > 200) { alert('Description too long (max 200)'); return; }
      const res = await fetch('/tasks/' + id, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      if (res.ok) { closeEdit(); fetchTasks(); }
      else { const e = await res.json().catch(() => ({})); alert(e.error || 'Failed to update task'); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchTasks();
      setupPushNotifications();
      // wire color swatches + dismiss-on-backdrop / Esc
      document.querySelectorAll('#editModal .swatch').forEach(s => {
        s.addEventListener('click', () => selectEditColor(s.dataset.color));
      });
      document.getElementById('editModal').addEventListener('click', e => {
        if (e.target.id === 'editModal') closeEdit();
      });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEdit(); });
    });
  </script>

  <!-- Edit task modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>Edit Task</h3>
      <input type="hidden" id="editId">
      <label>Name</label>
      <input type="text" id="editName" maxlength="120" placeholder="Task name">
      <label>Description</label>
      <textarea id="editDesc" maxlength="200" placeholder="Details"></textarea>
      <div class="row">
        <div>
          <label>Date</label>
          <input type="date" id="editDate">
        </div>
        <div>
          <label>Time</label>
          <input type="time" id="editTime">
        </div>
      </div>
      <label>Color</label>
      <div class="swatches">
        <span class="swatch" data-color="#87CEEB" style="background:#87CEEB"></span>
        <span class="swatch" data-color="#f05656" style="background:#f05656"></span>
        <span class="swatch" data-color="#6CE5A9" style="background:#6CE5A9"></span>
        <span class="swatch" data-color="#F8C8DC" style="background:#F8C8DC"></span>
        <span class="swatch" data-color="#ff7f00" style="background:#ff7f00"></span>
        <span class="swatch" data-color="#A96CE5" style="background:#A96CE5"></span>
        <span class="swatch" data-color="#FDDA0D" style="background:#FDDA0D"></span>
        <span class="swatch none" data-color="#FFFFFF" title="None"></span>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" onclick="closeEdit()">Cancel</button>
        <button class="btn-save" onclick="saveEdit()">Save changes</button>
      </div>
    </div>
  </div>
</body>
</html>
