<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tasker 2.5!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* styles unchanged */
  </style>
</head>

<body>
<header>
  <div class="brand">Tasker 2.5!</div>
  <div class="user">
    <span>{{ username }}</span>
    <a href="{{ url_for('logout') }}">Logout</a>
  </div>
</header>

<main>
  <section>
    <h2>Your Tasks</h2>
    <ul id="taskList"></ul>
  </section>

  <section>
    <h3>Add Task</h3>
    <form id="taskForm">
      <textarea id="task_description" maxlength="200"></textarea>
      <button type="submit">Add Task</button>
    </form>
  </section>
</main>

<script>
  /* ---------- USER TZ METADATA ---------- */
  function buildUserTzMetadata() {
    const now = new Date();

    return {
      "todaysDate (yyyy/mm/dd): ": now.toLocaleDateString('en-CA'),
      "current time: ": ` ${now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      })} `,
      "current day: ": ` ${now.toLocaleDateString('en-US', {
        weekday: 'long'
      })} `
    };
  }

  async function loadTasks() {
    const response = await fetch('/tasks');
    const tasks = await response.json();
    const taskList = document.getElementById('taskList');
    taskList.innerHTML = '';

    tasks.forEach(task => {
      const [id, __, task_name, task_time, task_description, due_date, priority, color] = task;

      const li = document.createElement('li');
      li.className = 'task-card';
      li.innerHTML = `
        <div class="task-header">
          <span style="color:${color};">${task_name}</span>
        </div>
        <div>${task_description}</div>
        <button onclick="deleteTask(${id})">Delete</button>
      `;
      taskList.appendChild(li);
    });
  }

  async function deleteTask(taskId) {
    await fetch('/tasks/' + taskId, { method: 'DELETE' });
    loadTasks();
  }

  document.getElementById('taskForm').addEventListener('submit', async e => {
    e.preventDefault();

    const description = document.getElementById('task_description').value;

    const taskData = {
      task_description: description,
      user_tz_metadata: buildUserTzMetadata()
    };

    const response = await fetch('/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(taskData)
    });

    if (response.ok) {
      e.target.reset();
      loadTasks();
    }
  });

  loadTasks();
</script>
</body>
</html>
