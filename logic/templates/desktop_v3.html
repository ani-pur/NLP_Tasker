<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | Tasker.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { base: '#111520', accent: '#fcd34d' } } } }
  </script>
  <style>
    body { background-color: #111520; overflow: hidden; }
    .snap { animation: snap 180ms ease-out; }
    @keyframes snap { 0% { opacity: 0; transform: translateY(-4px) scale(1.05); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* --- Background Effects --- */
    #parallax-grid {
      background-image: radial-gradient(rgba(148, 163, 184, 0.15) 1.5px, transparent 1.5px);
      background-size: 40px 40px;
      will-change: transform;
      transition: transform 0.15s ease-out;
    }
    #spotlight {
      background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(252, 211, 77, 0.04), transparent 40%);
      will-change: background;
    }
    select option {
      background: #1e293b;
      color: #e2e8f0;
    }
  </style>
</head>
<body class="text-slate-300 antialiased selection:bg-accent selection:text-base h-screen flex flex-col relative">

  <div class="fixed inset-0 z-[-1] pointer-events-none overflow-hidden bg-base">
    <div id="spotlight" class="absolute inset-0 z-10"></div>
    <div id="parallax-grid" class="absolute inset-[-10%] w-[120%] h-[120%] z-0"></div>
  </div>

  <header class="w-full border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-xl shrink-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="relative inline-flex items-center">
        <select onchange="if(this.value)window.location=this.value" class="appearance-none bg-transparent text-2xl font-extrabold text-white tracking-tighter cursor-pointer pr-6 outline-none">
          <option value="" selected>Tasker.</option>
          <option value="/switch/2">OG (Retired)</option>
          <option value="/switch/5">Editorial</option>
          <option value="/switch/6">Glass</option>
        </select>
        <svg class="absolute right-0 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-500 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="flex items-center gap-5 text-sm font-medium">
        <span class="text-slate-400">{{ username }}</span>
        <a href="https://github.com/ani-pur/NLP_Tasker/blob/main/README.md" target="_blank" rel="noopener" class="text-slate-500 hover:text-white transition duration-200">README</a>
        <a href="{{ url_for('calendar') }}" class="text-slate-500 hover:text-white transition duration-200">Calendar</a>
        <a href="{{ url_for('logout') }}" class="text-red-400/80 hover:text-red-400 transition duration-200">Logout</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto w-full px-6 py-8 grid grid-cols-12 gap-8 h-[calc(100vh-4rem)] overflow-hidden">
    
    <section class="col-span-8 flex flex-col min-h-0 gap-6">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800 gap-4 shrink-0">
        <h2 class="text-3xl font-bold text-white tracking-tight">Your Tasks</h2>
        <div class="inline-flex items-center gap-2 px-4 py-2 bg-slate-900/80 border border-slate-800 rounded-lg shadow-inner backdrop-blur-md">
          <span id="clockDate" class="text-accent font-bold text-xs tracking-widest uppercase"></span>
          <span class="text-slate-600 font-bold">·</span>
          <span id="clockTime" class="text-slate-300 font-bold text-xs tracking-widest tabular-nums"></span>
        </div>
      </div>

      <ul id="taskList" class="flex-grow overflow-y-auto pr-4 custom-scrollbar pb-12 flex flex-col gap-4"></ul>
    </section>

    <!-- Edit task modal -->
    <div id="editModal" class="hidden fixed inset-0 z-[200] items-center justify-center bg-black/60 backdrop-blur-sm p-5">
      <div class="w-full max-w-md bg-slate-900/95 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-md">
        <h3 class="text-lg font-bold text-white mb-4">Edit Task</h3>
        <input type="hidden" id="editId">
        <label class="block text-xs uppercase tracking-widest text-slate-500 mt-3 mb-1.5">Name</label>
        <input type="text" id="editName" maxlength="120" placeholder="Task name" class="w-full bg-slate-950/50 border border-slate-800 focus:border-accent/50 focus:ring-1 focus:ring-accent/50 text-slate-200 px-3 py-2 rounded-lg outline-none">
        <label class="block text-xs uppercase tracking-widest text-slate-500 mt-3 mb-1.5">Description</label>
        <textarea id="editDesc" maxlength="200" placeholder="Details" class="w-full h-20 resize-none bg-slate-950/50 border border-slate-800 focus:border-accent/50 focus:ring-1 focus:ring-accent/50 text-slate-200 px-3 py-2 rounded-lg outline-none"></textarea>
        <div class="flex gap-3 mt-3">
          <div class="flex-1">
            <label class="block text-xs uppercase tracking-widest text-slate-500 mb-1.5">Date</label>
            <input type="date" id="editDate" class="w-full bg-slate-950/50 border border-slate-800 text-slate-200 px-3 py-2 rounded-lg outline-none" style="color-scheme: dark;">
          </div>
          <div class="flex-1">
            <label class="block text-xs uppercase tracking-widest text-slate-500 mb-1.5">Time</label>
            <input type="time" id="editTime" class="w-full bg-slate-950/50 border border-slate-800 text-slate-200 px-3 py-2 rounded-lg outline-none" style="color-scheme: dark;">
          </div>
        </div>
        <label class="block text-xs uppercase tracking-widest text-slate-500 mt-3 mb-1.5">Color</label>
        <div class="flex gap-2 flex-wrap">
          <span class="edit-swatch w-6 h-6 rounded-full cursor-pointer border-2 border-transparent" data-color="#87CEEB" style="background:#87CEEB"></span>
          <span class="edit-swatch w-6 h-6 rounded-full cursor-pointer border-2 border-transparent" data-color="#f05656" style="background:#f05656"></span>
          <span class="edit-swatch w-6 h-6 rounded-full cursor-pointer border-2 border-transparent" data-color="#6CE5A9" style="background:#6CE5A9"></span>
          <span class="edit-swatch w-6 h-6 rounded-full cursor-pointer border-2 border-transparent" data-color="#F8C8DC" style="background:#F8C8DC"></span>
          <span class="edit-swatch w-6 h-6 rounded-full cursor-pointer border-2 border-transparent" data-color="#ff7f00" style="background:#ff7f00"></span>
          <span class="edit-swatch w-6 h-6 rounded-full cursor-pointer border-2 border-transparent" data-color="#A96CE5" style="background:#A96CE5"></span>
          <span class="edit-swatch w-6 h-6 rounded-full cursor-pointer border-2 border-transparent" data-color="#FDDA0D" style="background:#FDDA0D"></span>
          <span class="edit-swatch w-6 h-6 rounded-full cursor-pointer border-2 border-transparent" data-color="#FFFFFF" title="None" style="background:linear-gradient(135deg,#334155,#0f172a)"></span>
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button type="button" onclick="closeEdit()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-sm font-semibold hover:bg-slate-700 transition">Cancel</button>
          <button type="button" onclick="saveEdit()" class="px-4 py-2 rounded-lg bg-accent text-slate-900 text-sm font-semibold hover:bg-yellow-300 transition">Save changes</button>
        </div>
      </div>
    </div>

    <section class="col-span-4 shrink-0">
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-md sticky top-0">
        <h3 class="text-lg font-bold text-white mb-4">Describe Task</h3>
        <form id="taskForm" class="flex flex-col gap-4">
          <textarea id="task_description" maxlength="200" class="w-full h-32 bg-slate-950/50 border border-slate-800 focus:border-accent/50 focus:ring-1 focus:ring-accent/50 text-slate-200 px-4 py-3 rounded-xl outline-none transition-colors placeholder:text-slate-600 resize-none font-medium custom-scrollbar"></textarea>
          <div class="flex items-center justify-between">
            <span id="reminderPreview" class="hidden text-xs font-semibold text-amber-400/90 bg-amber-900/20 border border-amber-800/30 px-2.5 py-1 rounded-md transition-all">🔔 <span id="reminderValue"></span></span>
            <span></span>
          </div>
          <button type="submit" class="w-full bg-accent text-base font-semibold py-3 px-4 rounded-xl hover:bg-yellow-300 transition duration-200 shadow-[0_0_15px_rgba(252,211,77,0.15)] hover:shadow-[0_0_20px_rgba(252,211,77,0.3)] text-slate-900">Add Task</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    // --- Background Parallax & Spotlight ---
    const grid = document.getElementById('parallax-grid');
    const spotlight = document.getElementById('spotlight');
    let ticking = false;

    document.addEventListener('mousemove', (e) => {
      if (!ticking) {
        requestAnimationFrame(() => {
          // Update spotlight position
          spotlight.style.setProperty('--mouse-x', `${e.clientX}px`);
          spotlight.style.setProperty('--mouse-y', `${e.clientY}px`);
          
          // Calculate parallax offset (moves opposite to mouse)
          const moveX = (e.clientX / window.innerWidth - 0.5) * -40; 
          const moveY = (e.clientY / window.innerHeight - 0.5) * -40;
          grid.style.transform = `translate(${moveX}px, ${moveY}px)`;
          
          ticking = false;
        });
        ticking = true;
      }
    });

    // --- UI State & Inputs ---
    const taskInput = document.getElementById('task_description');
    const prompts = ["gym next monday 7am legs, blue", "groceries in 2 hours yellow, milk eggs chicken rice", "submit project by Friday evening, orange", "call mom tomorrow at noon pink", "doctor appointment next tuesday 9am, red", "read 20 pages of book tonight, purple", "fix production bug before standup, green"];
    taskInput.placeholder = 'Try: ' + prompts[Math.floor(Math.random() * prompts.length)];

    const colorMap = { blue: '#87CEEB', red: '#f05656', green: '#6CE5A9', pink: '#F8C8DC', orange: '#ff7f00', purple: '#A96CE5', yellow: '#FDDA0D' };

    function extractColor(text) {
      const matches = text.toLowerCase().match(/\b(blue|red|green|pink|orange|purple|yellow)\b/g);
      if (matches && matches.length > 0) return colorMap[matches[matches.length - 1]];
      return '#FFFFFF';
    }

    function cleanDescription(text, reminder, color) {
      let cleaned = text;
      if (reminder && reminder.display) {
        cleaned = cleaned.replace(/(?:,\s*)?(?:remind|notify|alert)\s+(?:me\s+)?(?:in\s+)?\d+\s*(?:m|mi|min|minu|minut|minute|minutes|h|ho|hou|hour|hours|hr|hrs)\b/gi, '');
        cleaned = cleaned.replace(/(?:,\s*)?(?:remind|notify|alert)\s+(?:me\s+)?at\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/gi, '');
      }
      if (color && color !== '#FFFFFF') {
        cleaned = cleaned.replace(/\b(blue|red|green|pink|orange|purple|yellow)\b/gi, '');
      }
      return cleaned.replace(/,\s*,/g, ',').replace(/\s{2,}/g, ' ').replace(/^[,\s]+|[,\s]+$/g, '').trim();
    }

    function parseReminder(text) {
      const t = text.toLowerCase();
      // relative: "remind me 30 min before", "notify 2 hours prior"
      const rel = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?(\d+)\s*(m|mi|min|minu|minut|minute|minutes|h|ho|hou|hour|hours|hr|hrs)\b/);
      if (rel) {
        const val = parseInt(rel[1]);
        const unit = rel[2];
        if (unit.startsWith('h')) {
          const clamped = Math.min(val, 24);
          return { offsetHours: clamped, absoluteTime: null, display: `${clamped}h` };
        } else {
          const hours = val / 60;
          const clamped = Math.min(hours, 24);
          return { offsetHours: clamped, absoluteTime: null, display: `${val}m` };
        }
      }
      // relative to now: "remind me in 30 min", "notify me in 2 hours"
      const relIn = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?in\s+(\d+)\s*(m|mi|min|minu|minut|minute|minutes|h|ho|hou|hour|hours|hr|hrs)\b/);
      if (relIn) {
        const val = parseInt(relIn[1]);
        const unit = relIn[2];
        const ms = unit.startsWith('h') ? val * 3600000 : val * 60000;
        const target = new Date(Date.now() + ms);
        let h = target.getHours(), m = target.getMinutes();
        const period = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        const display = m > 0 ? `${h}:${String(m).padStart(2,'0')}${period}` : `${h}${period}`;
        const absoluteTime = `${h}:${String(m).padStart(2,'0')} ${period}`;
        return { offsetHours: null, absoluteTime, display };
      }
      // absolute: "remind at 2pm", "remind me at 3:30am"
      const abs = t.match(/(?:remind|notify|alert)\s+(?:me\s+)?at\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
      if (abs) {
        const hour = parseInt(abs[1]);
        const mins = abs[2] ? parseInt(abs[2]) : 0;
        const period = abs[3].toUpperCase();
        const display = mins > 0 ? `${hour}:${String(mins).padStart(2,'0')}${period}` : `${hour}${period}`;
        const absoluteTime = `${hour}:${String(mins).padStart(2,'0')} ${period}`;
        return { offsetHours: null, absoluteTime, display };
      }
      return { offsetHours: 0, absoluteTime: null, display: null };
    }

    taskInput.addEventListener('input', (e) => {
      const text = e.target.value.toLowerCase();
      const regex = /\b(blue|red|green|pink|orange|purple|yellow)\b/g;
      const matches = text.match(regex);
      if (matches && matches.length > 0) {
        const activeColor = matches[matches.length - 1];
        e.target.style.color = colorMap[activeColor];
      } else {
        e.target.style.color = '';
      }
      // reminder preview
      const reminder = parseReminder(e.target.value);
      const preview = document.getElementById('reminderPreview');
      if (reminder.display) {
        document.getElementById('reminderValue').textContent = reminder.display;
        preview.classList.remove('hidden');
      } else {
        preview.classList.add('hidden');
      }
    });

    // --- Clock Logic ---
    let clockTimer;
    
    function renderClock(animate = false) {
      const now = new Date();
      document.getElementById("clockDate").textContent = now.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }).toUpperCase();
      const elTime = document.getElementById("clockTime");
      elTime.textContent = now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      if (animate) {
        elTime.classList.remove("snap");
        void elTime.offsetWidth; 
        elTime.classList.add("snap");
      }
    }

    function scheduleNextClockTick() {
      if (clockTimer) clearTimeout(clockTimer);
      const msToNextMinute = (60000 - (Date.now() % 60000)) + 80;
      clockTimer = setTimeout(() => {
        renderClock(true);
        scheduleNextClockTick();
      }, msToNextMinute);
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        renderClock(false); 
        scheduleNextClockTick(); 
      }
    });

    // --- Core Tasker Logic ---
    let addTaskCooldown = false;
    const ADD_TASK_COOLDOWN_MS = 3000; 
    
    function buildUserTzMetadata() {
      const now = new Date();
      return {
        "todaysDate (yyyy/mm/dd): ": now.toLocaleDateString('en-CA'),
        "current time: ": ` ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })} `,
        "current day: ": ` ${now.toLocaleDateString('en-US', { weekday: 'long' })} `,
        "utc_offset_minutes": now.getTimezoneOffset()
      };
    }

    let currentTasks = [];                 // last fetched rows, used by the edit modal

    async function loadTasks() {
          try {
            const response = await fetch('/tasks');
            const tasks = await response.json();
            currentTasks = tasks;
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';
    
            const now = new Date();
            const pastDueTasks = [];
            const upcomingTasks = [];
    

            // 1. Sort tasks into Past Due and Upcoming
            tasks.forEach(task => {
              const [id, __, task_name, task_time, task_description, due_date, color, reminder_display] = task;
              let isPastDue = false;
    
              if (due_date) {
                // Strip the trailing " 00:00:00" from the DB if it exists, leave "Sun, 22 Feb 2026"
                const cleanDate = due_date.replace(/ 00:00:00.*$/, '').trim(); 
                // Default to 11:59 PM if no specific time is set
                const timeStr = task_time ? task_time.trim() : '11:59 PM'; 
                
                // Let JS natively parse "Sun, 22 Feb 2026 06:00 PM"
                const taskDateTime = new Date(`${cleanDate} ${timeStr}`);
                
                // Check if parsing was successful AND if the time has passed
                if (!isNaN(taskDateTime) && taskDateTime < now) {
                  isPastDue = true;
                }
              }
    
              if (isPastDue) {
                pastDueTasks.push(task);
              } else {
                upcomingTasks.push(task);
              }
            });
    
            // 2. Render Helper
            const renderTaskHtml = (task, isPastDue) => {
              const [id, __, task_name, task_time, task_description, due_date, color, reminder_display] = task;
              const dueDateDisplay = due_date ? due_date.replace(/ 00:00:00.*$/, '') : "No due date";
              
              // Toggle pill colors based on status
              const badgeColors = isPastDue 
                ? "text-red-400 bg-red-900/20 border-red-800/30 shadow-[0_0_8px_rgba(239,68,68,0.15)]" 
                : "text-sky-300 bg-sky-900/20 border-sky-800/30";
    
              return `
                <li class="task-card-item bg-slate-900/60 border border-slate-800/80 hover:border-slate-700/80 rounded-xl p-5 transition duration-200 group relative overflow-hidden shrink-0 backdrop-blur-sm">
                  <div class="flex justify-between items-start gap-4">
                    <h4 class="font-bold text-lg leading-tight flex-1 min-w-0" style="color:${color || '#fcd34d'};">${task_name}</h4>
                    <div class="flex items-center gap-1.5 shrink-0">
                      ${reminder_display ? `<span class="text-xs font-semibold text-amber-400/80 bg-amber-900/20 border border-amber-800/30 px-2 py-1.5 rounded-md whitespace-nowrap" title="Reminder set">🔔 ${reminder_display}</span>` : ''}
                      <span class="text-xs font-semibold tracking-wide ${badgeColors} px-3 py-1.5 rounded-md border whitespace-nowrap">${dueDateDisplay}${task_time ? ' • ' + task_time : ''}</span>
                    </div>
                  </div>
                  <p class="text-slate-400 text-sm leading-relaxed whitespace-pre-wrap mt-2">${task_description}</p>
                  <div class="flex justify-end gap-3 mt-2 opacity-0 group-hover:opacity-100 transition duration-200">
                    <button type="button" onclick="openEdit(${id})" class="text-slate-500 hover:text-accent text-xs font-semibold uppercase tracking-wide transition">Edit</button>
                    <button type="button" onclick="deleteTask(${id})" class="text-slate-500 hover:text-red-400 text-xs font-semibold uppercase tracking-wide transition">Delete</button>
                  </div>
                </li>
              `;
            };
    
            // 3. Inject to DOM
            pastDueTasks.forEach(task => {
              taskList.insertAdjacentHTML('beforeend', renderTaskHtml(task, true));
            });
    
            // Only inject the glowing divider if there are past due tasks
            if (pastDueTasks.length > 0) {
              taskList.insertAdjacentHTML('beforeend', `
                <li class="relative flex items-center py-6 w-full">
                  <div class="flex-grow border-t border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.6)]"></div>
                  <span class="shrink-0 mx-4 px-3 py-1 bg-slate-900 text-red-400 text-xs font-bold tracking-widest uppercase border border-red-500/50 rounded-full shadow-[0_0_10px_rgba(239,68,68,0.3)]">
                    Past Due
                  </span>
                  <div class="flex-grow border-t border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.6)]"></div>
                </li>
              `);
            }
    
            upcomingTasks.forEach(task => {
              taskList.insertAdjacentHTML('beforeend', renderTaskHtml(task, false));
            });
    
          } catch (err) { console.error("Error loading tasks:", err); }
        }

    async function deleteTask(taskId) {
      const response = await fetch('/tasks/' + taskId, { method: 'DELETE' });
      if (response.ok) loadTasks();
      else alert('Failed to delete task');
    }

    // --- Edit Task ---
    const EDIT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let selectedEditColor = '#FFFFFF';

    // due_date arrives as "Thu, 14 Mar 2026 00:00:00 GMT"; pull it back to a yyyy-mm-dd
    // value for <input type=date>. Parse at local noon so a tz shift can't roll the day.
    function dueToInput(due) {
      if (!due) return '';
      const c = due.replace(/ 00:00:00.*$/, '').trim();
      const d = new Date(c + ' 12:00');
      if (isNaN(d)) return '';
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function timeTo24(t) {
      if (!t) return '';
      const m = t.trim().match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
      if (!m) return '';
      let h = parseInt(m[1]) % 12;
      if (/pm/i.test(m[3])) h += 12;
      return `${String(h).padStart(2,'0')}:${m[2]}`;
    }
    function inputToDue(v) {
      if (!v) return null;
      const [y, mo, d] = v.split('-').map(Number);
      return `${String(d).padStart(2,'0')} ${EDIT_MONTHS[mo-1]} ${y}`;
    }
    function input24ToTime(v) {
      if (!v) return null;
      let [h, m] = v.split(':').map(Number);
      const p = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${String(m).padStart(2,'0')} ${p}`;
    }
    function selectEditColor(hex) {
      selectedEditColor = hex || '#FFFFFF';
      document.querySelectorAll('#editModal .edit-swatch').forEach(s => {
        s.style.borderColor = s.dataset.color.toLowerCase() === selectedEditColor.toLowerCase() ? '#fcd34d' : 'transparent';
      });
    }
    function openEdit(id) {
      const t = currentTasks.find(x => x[0] === id);
      if (!t) return;
      const [, , name, time, desc, due, color] = t;
      document.getElementById('editId').value = id;
      document.getElementById('editName').value = name || '';
      document.getElementById('editDesc').value = desc || '';
      document.getElementById('editDate').value = dueToInput(due);
      document.getElementById('editTime').value = timeTo24(time);
      selectEditColor(color || '#FFFFFF');
      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('editModal').classList.add('flex');
    }
    function closeEdit() {
      document.getElementById('editModal').classList.add('hidden');
      document.getElementById('editModal').classList.remove('flex');
    }
    async function saveEdit() {
      const id = document.getElementById('editId').value;
      const body = {
        task_name: document.getElementById('editName').value.trim(),
        task_description: document.getElementById('editDesc').value.trim(),
        due_date: inputToDue(document.getElementById('editDate').value),
        task_time: input24ToTime(document.getElementById('editTime').value),
        color: selectedEditColor,
        user_tz_metadata: buildUserTzMetadata()
      };
      if (!body.task_name) { alert('Task name is required'); return; }
      if (body.task_description.length > 200) { alert('Description too long (max 200)'); return; }
      const res = await fetch('/tasks/' + id, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      if (res.ok) { closeEdit(); loadTasks(); }
      else { const e = await res.json().catch(() => ({})); alert(e.error || 'Failed to update task'); }
    }
    document.querySelectorAll('#editModal .edit-swatch').forEach(s => {
      s.addEventListener('click', () => selectEditColor(s.dataset.color));
    });
    document.getElementById('editModal').addEventListener('click', e => {
      if (e.target.id === 'editModal') closeEdit();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEdit(); });


    document.getElementById('taskForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (addTaskCooldown) return;
      addTaskCooldown = true;
      setTimeout(() => { addTaskCooldown = false; }, ADD_TASK_COOLDOWN_MS);
      
      const inputEl = document.getElementById('task_description');
      const description = inputEl.value;
      if (description.length < 10 || description.length > 200) { alert('Task description must be 10-200 characters'); return; }

      const reminder = parseReminder(description);
      const color = extractColor(description);
      const cleanedDesc = cleanDescription(description, reminder, color);
      const response = await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task_description: cleanedDesc, user_tz_metadata: buildUserTzMetadata(), color: color, notif_time_offset: reminder.offsetHours, notif_absolute_time: reminder.absoluteTime, reminder_display: reminder.display })
      });
      if (response.ok) {
        document.getElementById('taskForm').reset();
        inputEl.style.color = '';
        document.getElementById('reminderPreview').classList.add('hidden');
        inputEl.placeholder = 'Try: ' + prompts[Math.floor(Math.random() * prompts.length)];
        loadTasks();
      } 
      else { alert('Failed to add task'); }
    });

    // --- Push Notifications ---
    async function setupPushNotifications() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

      try {
        const reg = await navigator.serviceWorker.register('/sw.js');

        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;

        // check if already subscribed
        const existing = await reg.pushManager.getSubscription();
        if (existing) return;

        // fetch VAPID public key from server
        const keyRes = await fetch('/push/vapid-public-key');
        const keyData = await keyRes.json();
        if (!keyData.public_key) return;

        // convert base64url to Uint8Array
        const rawKey = atob(keyData.public_key.replace(/-/g, '+').replace(/_/g, '/'));
        const vapidKey = new Uint8Array(rawKey.length);
        for (let i = 0; i < rawKey.length; i++) vapidKey[i] = rawKey.charCodeAt(i);

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: vapidKey
        });

        const subJson = sub.toJSON();
        await fetch('/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            endpoint: subJson.endpoint,
            keys: subJson.keys
          })
        });
      } catch (err) {
        console.error('Push setup failed:', err);
      }
    }

    // --- Init ---
    renderClock(false);
    scheduleNextClockTick();
    loadTasks();
    setupPushNotifications();
  </script>
</body>
</html>
